<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Plan de regreso</title>
<meta name="theme-color" content="#F2F0EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101512" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap">
<style>
:root {
  --bg: #F2F0EA; --surface: #FFFFFF; --ink: #16211C; --muted: #56605A; --line: #DAD6CB; --chip: #E2DFD5;
  --table: #1F6B4F; --table-ink: #CFE8DC; --rim: #FFFFFF;
  --card: #FFFFFF; --card-soft: rgba(255,255,255,.94); --card-ink: #16211C;
  --ball: #FF7A1A; --ball-ink: #B24D00; --peach: #FFD2AE;
  --wait-ink: #7A4D0E; --wait-bg: #F7E8CC; --done: #2F6B4A;
  --score: #16211C; --score-tile: #2A3730; --score-muted: #A9B8B0; --score-ink: #F2F0EA;
  --shadow: 0 24px 50px rgba(22,33,28,.22);
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101512; --surface: #1A221E; --ink: #E9EEE9; --muted: #A5B0A9; --line: #2B3530; --chip: #222B26;
    --table: #1B5A43; --table-ink: #CFE8DC; --rim: #D9E4DD;
    --card: #1A221E; --card-soft: rgba(26,34,30,.94); --card-ink: #E9EEE9;
    --ball-ink: #FF9A4D; --wait-ink: #F0C47A; --wait-bg: #3A2E18; --done: #6CC18D;
    --score: #0A0F0C; --score-tile: #1F2A24;
    --shadow: 0 24px 50px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101512; --surface: #1A221E; --ink: #E9EEE9; --muted: #A5B0A9; --line: #2B3530; --chip: #222B26;
  --table: #1B5A43; --table-ink: #CFE8DC; --rim: #D9E4DD;
  --card: #1A221E; --card-soft: rgba(26,34,30,.94); --card-ink: #E9EEE9;
  --ball-ink: #FF9A4D; --wait-ink: #F0C47A; --wait-bg: #3A2E18; --done: #6CC18D;
  --score: #0A0F0C; --score-tile: #1F2A24;
  --shadow: 0 24px 50px rgba(0,0,0,.45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 var(--body); }
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; }
a { color: inherit; }
[hidden] { display: none !important; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
@media (min-width: 860px) { .wrap { padding: 0 40px; } }

/* Shared bits */
.label { font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
.lang { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--chip); }
.lang button { border: 0; background: none; min-width: 48px; height: 38px; border-radius: 999px; font-weight: 700; font-size: 14px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.ball { width: 40px; height: 40px; border-radius: 50%; background: var(--ball); box-shadow: inset -6px -6px 0 rgba(0,0,0,.12), 0 6px 12px rgba(0,0,0,.3); animation: bob 1.6s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
.dots i { font-style: normal; animation: blink 1.4s infinite; }
.dots i:nth-child(2) { animation-delay: .2s; }
.dots i:nth-child(3) { animation-delay: .4s; }
.btn-ball {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 0 22px;
  border: 0; border-radius: 999px; background: var(--ball); color: #16211C; text-decoration: none; font-weight: 700; font-size: 17px; cursor: pointer;
}
.btn-ball svg { width: 20px; height: 20px; flex: none; }
.tag { display: inline-block; align-self: flex-start; font-size: 13px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--wait-bg); color: var(--wait-ink); }

/* Gate */
.gate { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 72px 20px calc(32px + env(safe-area-inset-bottom)); position: relative; }
.gate .lang { position: absolute; top: calc(16px + env(safe-area-inset-top)); right: 16px; }
.gate-card { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; }
.gate-card .ball { margin-bottom: 12px; }
.gate h1 { font-family: var(--display); font-weight: 800; font-size: 48px; line-height: 1; letter-spacing: -.025em; }
.gate p { color: var(--muted); margin-bottom: 12px; }
.pin {
  width: 100%; font-size: 30px; letter-spacing: .4em; text-align: center; padding: 14px 12px 14px calc(12px + .4em);
  border: 2px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); outline: none;
}
.pin:focus { border-color: var(--table); box-shadow: 0 0 0 4px color-mix(in srgb, var(--table) 25%, transparent); }
.btn { width: 100%; min-height: 56px; border: 0; border-radius: 999px; background: var(--ink); color: var(--bg); font-weight: 700; font-size: 18px; cursor: pointer; }
.btn:disabled { opacity: .6; cursor: default; }
.err { color: var(--wait-ink); min-height: 1.6em; font-weight: 700; text-align: center; }

/* Header */
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: calc(14px + env(safe-area-inset-top)) 0 0; }
.brand { font-family: var(--display); font-weight: 800; font-size: 19px; letter-spacing: -.01em; }
.top .right { display: flex; align-items: center; gap: 16px; }
.top .updated { font-size: 15px; color: var(--muted); }
@media (max-width: 859px) { .top .updated { display: none; } }

.hello { padding: 22px 0 20px; display: flex; flex-direction: column; gap: 6px; }
.hello h1 { font-family: var(--display); font-weight: 800; font-size: clamp(38px, 6vw, 60px); line-height: 1.02; letter-spacing: -.025em; max-width: 18ch; }
.hello .sub { color: var(--muted); font-size: 17px; }
@media (min-width: 860px) { .hello h1 { max-width: none; } .hello .sub { font-size: 18px; } }

/* Two faces of one page: A "La hoja" on phones, E "Escritorio" on a computer. */
:root {
  --a-bg: #FFFFFF; --a-ink: #1B1F24; --a-soft: #3A424C; --a-muted: #5A636E; --a-line: #E3E6EA; --a-line2: #EEF0F2; --a-head: #F6F8FA; --a-chip: #F1F3F5;
  --a-green: #1D7A4E; --a-green-bg: #E7F3EC; --a-next: #FFF7ED; --a-orange: #C2410C; --a-done: #8A929B; --a-total: #1B1F24; --a-total-ink: #FFFFFF;
  --e-bg: #EEF2FA; --e-tile: #FFFFFF; --e-ink: #111827; --e-muted: #566079; --e-line: #E5EAF3; --e-teal: #1F4FD8; --e-teal-bg: #DCE5FB;
  --e-amber: #B45309; --e-amber-bar: #E7A15A; --e-done: #15803D; --e-empty: #E2E7F1; --e-next: #EDF2FF; --e-seg: #DFE5F1; --e-faded: #97A0B3;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --a-bg: #0F1215; --a-ink: #E6E9EC; --a-soft: #C4CAD1; --a-muted: #9AA3AD; --a-line: #2A3036; --a-line2: #22272C; --a-head: #171B1F; --a-chip: #1D2226;
    --a-green: #4CC38A; --a-green-bg: #16301F; --a-next: #2A1D12; --a-orange: #F5A26B; --a-done: #6F7780; --a-total: #E6E9EC; --a-total-ink: #0F1215;
    --e-bg: #0C1120; --e-tile: #151C2F; --e-ink: #E8ECF5; --e-muted: #9AA4BA; --e-line: #232B41; --e-teal: #6E93FF; --e-teal-bg: #1B2A55;
    --e-amber: #F0A45B; --e-amber-bar: #B7773C; --e-done: #4CB872; --e-empty: #283149; --e-next: #17224A; --e-seg: #1E2740; --e-faded: #6B7590;
  }
}
:root[data-theme="dark"] {
  --a-bg: #0F1215; --a-ink: #E6E9EC; --a-soft: #C4CAD1; --a-muted: #9AA3AD; --a-line: #2A3036; --a-line2: #22272C; --a-head: #171B1F; --a-chip: #1D2226;
  --a-green: #4CC38A; --a-green-bg: #16301F; --a-next: #2A1D12; --a-orange: #F5A26B; --a-done: #6F7780; --a-total: #E6E9EC; --a-total-ink: #0F1215;
  --e-bg: #0C1120; --e-tile: #151C2F; --e-ink: #E8ECF5; --e-muted: #9AA4BA; --e-line: #232B41; --e-teal: #6E93FF; --e-teal-bg: #1B2A55;
  --e-amber: #F0A45B; --e-amber-bar: #B7773C; --e-done: #4CB872; --e-empty: #283149; --e-next: #17224A; --e-seg: #1E2740; --e-faded: #6B7590;
}
#desk { display: none; }
body.in { background: var(--a-bg); }
@media (min-width: 1024px) {
  #phone { display: none; }
  #desk { display: flex; }
  body.in { background: var(--e-bg); }
}
body.in .tail { color: var(--a-ink); }
@media (min-width: 1024px) { body.in .tail { color: var(--e-ink); } }

/* A: La hoja */
.A { font-family: "IBM Plex Sans", system-ui, sans-serif; color: var(--a-ink); background: var(--a-bg); max-width: 640px; margin: 0 auto; }
.A .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
.a-top { padding: calc(20px + env(safe-area-inset-top)) 16px 14px; display: flex; flex-direction: column; gap: 4px; border-bottom: 1px solid var(--a-line); }
.a-top .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.a-top .brand { font-family: inherit; font-weight: 700; font-size: 20px; }
.a-top .sub { font-size: 14px; color: var(--a-muted); }
.a-top .sub b { color: var(--a-ink); }
.seg { display: inline-flex; background: var(--a-chip); border-radius: 8px; padding: 3px; }
.seg button { border: 0; background: none; font: 600 13px "IBM Plex Sans", sans-serif; padding: 0 12px; min-height: 36px; min-width: 44px; border-radius: 6px; cursor: pointer; color: var(--a-ink); }
.seg button[aria-pressed="true"] { background: var(--a-ink); color: var(--a-bg); }
.a-tabs { position: sticky; top: 0; z-index: 4; display: flex; padding: 0 8px; background: var(--a-bg); border-bottom: 1px solid var(--a-line); overflow-x: auto; scrollbar-width: none; }
.a-tabs::-webkit-scrollbar { display: none; }
.a-tabs a { flex: none; padding: 0 12px; min-height: 46px; display: inline-flex; align-items: center; font-weight: 600; font-size: 15px; color: var(--a-muted); border-bottom: 3px solid transparent; text-decoration: none; }
.a-tabs a[aria-current="true"] { color: var(--a-green); border-bottom-color: var(--a-green); }
.a-sec { padding: 20px 16px 0; display: flex; flex-direction: column; gap: 18px; scroll-margin-top: 50px; }
.a-block { display: flex; flex-direction: column; gap: 8px; }
.a-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.a-h span:first-child { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--a-muted); }
.a-h .mono { font-size: 13px; color: var(--a-muted); }
.a-grid { border: 1px solid var(--a-line); border-radius: 10px; overflow: hidden; }
.a-grid > * + * { border-top: 1px solid var(--a-line); }
.a-goal { display: grid; grid-template-columns: 36px minmax(0, 1fr); }
.a-goal .n { background: var(--a-head); border-right: 1px solid var(--a-line); display: grid; place-items: center; font-size: 13px; color: var(--a-muted); }
.a-goal span:last-child { padding: 11px 12px; font-weight: 600; font-size: 16px; line-height: 1.35; }
.a-task { display: grid; grid-template-columns: 44px minmax(0, 1fr); align-items: center; min-height: 52px; cursor: pointer; }
.a-task.static { cursor: default; }
.a-task .cb { display: grid; place-items: center; }
.a-task input { width: 22px; height: 22px; margin: 0; accent-color: var(--a-green); cursor: pointer; }
.a-task .txt { padding: 10px 12px 10px 0; font-size: 16px; line-height: 1.35; }
.a-task.done .txt { color: var(--a-done); text-decoration: line-through; }
.a-task.next { background: var(--a-next); }
.a-task .flag { display: block; margin-top: 4px; font-size: 12px; font-weight: 700; letter-spacing: .03em; color: var(--a-orange); }
.a-add { display: flex; }
.a-add input { flex-grow: 1; min-width: 0; border: 0; background: var(--a-bg); color: var(--a-ink); padding: 14px; font: 16px "IBM Plex Sans", sans-serif; outline: none; }
.a-add input:focus { background: var(--a-head); }
.a-add button { flex: none; border: 0; border-left: 1px solid var(--a-line); background: var(--a-head); color: var(--a-green); font: 700 15px "IBM Plex Sans", sans-serif; padding: 0 16px; cursor: pointer; }
.a-prow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; min-height: 44px; }
.a-prow span:first-child { font-size: 15px; line-height: 1.35; }
.a-prow.done span:first-child { color: var(--a-done); text-decoration: line-through; }
.pill { font-size: 11px; font-weight: 700; letter-spacing: .04em; padding: 3px 8px; border-radius: 5px; background: var(--a-chip); color: var(--a-muted); white-space: nowrap; }
.pill.doing { background: var(--a-green-bg); color: var(--a-green); }
.pill.blocked { background: var(--a-next); color: var(--a-orange); }
.a-money { font-size: 15px; }
.a-money > div { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; padding: 8px 12px; }
.a-money .g { background: var(--a-head); font-weight: 700; padding: 9px 12px; }
.a-money .g.total { background: var(--a-total); color: var(--a-total-ink); padding: 12px; }
.a-money .i span { color: var(--a-soft); }
.a-grid.a-money > .i + .i { border-top-color: var(--a-line2); }
.a-fund { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
.a-fund .row { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
.a-fund .row span:first-child { font-weight: 600; }
.a-bar { height: 8px; border-radius: 4px; background: var(--a-chip); overflow: hidden; }
.a-bar i { display: block; height: 100%; min-width: 4px; border-radius: 4px; background: var(--a-green); }
.a-fund .note { font-size: 14px; color: var(--a-muted); }
.a-two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; align-items: start; }
.a-box { border: 1px solid var(--a-line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.a-box b { font-size: 14px; }
.a-box label { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; line-height: 1.35; min-height: 28px; cursor: pointer; }
.a-box label input { flex: none; width: 18px; height: 18px; margin: 1px 0 0; accent-color: var(--a-green); }
.a-box label.done span { color: var(--a-done); text-decoration: line-through; }
.a-box .debt { font-size: 14px; font-weight: 600; }
.a-note { border: 1px solid var(--a-line); border-radius: 10px; padding: 12px 14px; font-size: 15px; line-height: 1.5; color: var(--a-soft); }
.a-note .d, .a-log .d { font-size: 12px; font-weight: 700; color: var(--a-muted); margin-bottom: 4px; letter-spacing: .02em; }
.a-log > div { padding: 10px 12px; font-size: 15px; line-height: 1.4; }
.a-btn { min-height: 52px; border: 0; border-radius: 10px; background: var(--a-green); color: #fff; font: 600 16px "IBM Plex Sans", sans-serif; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 18px; }
.a-btn svg { width: 18px; height: 18px; }
.a-btn.ghost { background: none; color: var(--a-green); border: 1px solid var(--a-line); }
.a-actions { display: flex; flex-direction: column; gap: 8px; }
.a-wa { align-self: flex-start; font-size: 14px; color: var(--a-muted); min-height: 40px; display: inline-flex; align-items: center; }
.dadtag { display: inline-block; margin-left: 6px; font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 4px; background: var(--a-next); color: var(--a-orange); letter-spacing: 0; }

/* E: Escritorio */
.E { font-family: "Figtree", system-ui, sans-serif; color: var(--e-ink); background: var(--e-bg); max-width: 1360px; margin: 0 auto; padding: 28px 40px 0; display: flex; flex-direction: column; gap: 18px; }
.E .serif { font-family: "Fraunces", Georgia, serif; font-weight: 700; }
.e-top { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
.e-top .l { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
.e-top h1 { font-size: 30px; line-height: 1.1; }
.e-top .upd { font-size: 15px; color: var(--e-muted); }
.e-top .r { display: flex; gap: 10px; align-items: center; }
.e-btn { min-height: 44px; padding: 0 18px; border: 0; border-radius: 12px; background: var(--e-teal); color: #fff; font: 600 15px "Figtree", sans-serif; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
.e-btn svg { width: 18px; height: 18px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .e-btn:not(.ghost) { color: #0C1120; } }
:root[data-theme="dark"] .e-btn:not(.ghost) { color: #0C1120; }
.e-btn.ghost { background: var(--e-tile); color: var(--e-ink); border: 1px solid var(--e-line); }
.E .seg { background: var(--e-seg); border-radius: 10px; }
.E .seg button { font-family: "Figtree", sans-serif; font-weight: 700; color: var(--e-ink); border-radius: 8px; }
.E .seg button[aria-pressed="true"] { background: var(--e-ink); color: var(--e-bg); }
.e-goals { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; font-size: 15px; color: var(--e-muted); }
.e-goals b { color: var(--e-ink); font-weight: 600; }
.e-goals .n { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--e-teal-bg); color: var(--e-teal); font-size: 12px; font-weight: 700; margin-right: 6px; }
.e-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.e-tile { background: var(--e-tile); border-radius: 16px; padding: 16px 20px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.e-tile .k { font-size: 13px; font-weight: 600; color: var(--e-muted); }
.e-tile .big { font-size: 36px; line-height: 1.05; }
.e-tile .big small { font-family: "Figtree", sans-serif; font-size: 15px; font-weight: 500; color: var(--e-muted); }
.e-tile .s { font-size: 14px; color: var(--e-muted); }
.e-bar { height: 8px; border-radius: 4px; background: var(--e-teal-bg); overflow: hidden; }
.e-bar i { display: block; height: 100%; min-width: 4px; border-radius: 4px; background: var(--e-teal); }
.e-track { display: flex; gap: 4px; }
.e-track span { flex-grow: 1; height: 10px; border-radius: 3px; background: var(--e-empty); }
.e-track .done { background: var(--e-done); }
.e-track .doing { background: var(--e-teal); }
.e-track .blocked { background: var(--e-amber-bar); }
.e-cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
.e-stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.e-tile h2 { font-size: 18px; font-weight: 700; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 4px; }
.e-tile h2 small { font-size: 13px; font-weight: 500; color: var(--e-muted); }
.e-task { display: flex; gap: 12px; align-items: flex-start; padding: 10px 8px; margin: 0 -8px; border-top: 1px solid var(--e-line); min-height: 44px; border-radius: 6px; cursor: pointer; }
.e-task.static { cursor: default; }
.e-task input { flex: none; width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--e-teal); cursor: pointer; }
.e-task span { font-size: 16px; line-height: 1.35; }

dialog.sheet {

}

      })));
      if (d.dadNotes && d.dadNotes.length) {
        body.push(el('h3', null, S('dadNotes')), ...d.dadNotes.map((n) => el('div', { class: 'note-card' },
          n.date ? el('div', { class: 'd' }, cap(fmtDay(n.date, { weekday: 'long', day: 'numeric', month: 'long' }).replace(',', ''))) : null,
          el('p', null, tr(n.text)))));
      }
    } else if (kind === 'write') {
      title = S('lWrite');
      body.push(el('form', { class: 'write', id: 'writeForm' },
        el('p', { class: 'small' }, S('writeHint')),
        el('textarea', { id: 'writeText', placeholder: S('writePh'), 'aria-label': S('lWrite'), maxlength: 2000 }),
        el('button', { class: 'btn-ball', type: 'submit' }, S('send'))));
    } else if (kind === 'money') {
      title = S('lMoney');
      if (d.budget) {
        body.push(el('p', { class: 'intro' }, S('budgetNote')));
        d.budget.groups.forEach((g) => body.push(el('h3', null, tr(g.title)), el('table', { class: 'money' }, el('tbody', null,
          g.items.map(([label, n]) => el('tr', null, el('td', null, tr(label)), el('td', null, money(n)))),
          g.total != null ? el('tr', { class: 'total' }, el('td', null, S('total')), el('td', null, money(g.total))) : null,
        ))));
      }
      if (d.credit) {
        body.push(el('h3', null, S('credit')), el('ul', { class: 'list' }, d.credit.steps.map((x) =>
          el('li', { class: x.status }, el('span', { class: 'box', 'aria-hidden': 'true' }, x.status === 'done' ? check() : null), el('div', { class: 't' }, tr(x.text))))));
        if (d.credit.debts && d.credit.debts.length) body.push(el('h3', null, S('debts')), el('ul', { class: 'list' }, d.credit.debts.map((x) =>
          el('li', { style: 'grid-template-columns: 1fr' }, el('span', null, tr(x))))));
      }
    } else if (kind === 'log') {
      title = S('lLog');
      body.push(el('ol', { class: 'list log' }, [...d.log].sort((a, b) => b.date.localeCompare(a.date)).map((x) =>
        el('li', { style: 'grid-template-columns: 1fr' },
          el('div', null, el('div', { class: 'd' }, cap(fmtDay(x.date, { weekday: 'long', day: 'numeric', month: 'long' }).replace(',', '')), x.by === 'eduardo' ? el('span', { class: 'by' }, S('byDad')) : null), el('p', null, tr(x.text))),
        ))));
    } else {
      title = S('lMore');
      body.push(el('h3', null, S('services')), el('ol', { class: 'list' }, d.services.map((s, i) => el('li', { class: 'svc' },
        el('span', { class: 'num-c' }, i + 1),
        el('div', null,
          el('b', null, tr(s.name)),
          s.price != null ? el('div', { class: 'price' }, typeof s.price === 'number' ? money(s.price) : tr(s.price)) : el('div', { class: 'price tbd' }, S('noPrice')),
          el('p', { class: 'small' }, tr(s.what)),
        ),
      ))));
      body.push(el('h3', null, S('rules')), el('ol', { class: 'list' }, d.rules.map((r, i) => el('li', null, el('span', { class: 'num-c' }, i + 1), el('p', null, tr(r))))));
    }
    $('sheetTitle').textContent = title;
    $('sheetBody').replaceChildren(...body);
  }

  function openSheet(kind) {
    if (!data) return;
    sheetKind = kind;
    fillSheet(kind);
    const dlg = $('sheet');
    if (!dlg.open) dlg.showModal();
    $('sheetBody').scrollTop = 0;
    if (kind === 'write') setTimeout(() => $('writeText') && $('writeText').focus(), 60);
  }

  // Phone tabs follow the scroll: the last section whose top has passed the tab bar.
  const tabNow = () => {
    const tabs = [...document.querySelectorAll('#aTabs a')];
    if (!tabs.length || $('phone').offsetParent === null) return;
    let cur = tabs[0];
    for (const a of tabs) { const sec = document.querySelector(a.getAttribute('href')); if (sec && sec.getBoundingClientRect().top < 120) cur = a; }
    if (innerHeight + scrollY >= document.body.scrollHeight - 4) cur = tabs[tabs.length - 1];
    tabs.forEach((a) => a.setAttribute('aria-current', String(a === cur)));
  };
  addEventListener('scroll', tabNow, { passive: true });
  addEventListener('resize', tabNow);

  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-sheet]');
    if (b) openSheet(b.dataset.sheet);
  });
  $('sheetClose').addEventListener('click', () => $('sheet').close());
  $('sheet').addEventListener('click', (e) => { if (e.target === $('sheet')) $('sheet').close(); });
  $('sheet').addEventListener('close', () => { sheetKind = null; });

  // ---------- flow ----------
  let blob = null;
  let data = null;   // last decrypted plan, kept so a language switch can re-render
  let errKey = '';   // error shown on the gate, by key so it follows the language

  function setErr(k) { errKey = k || ''; $('err').textContent = errKey ? S(errKey) : ''; }

  // Fixed labels, html lang and the switch state
  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-t]').forEach((n) => { n.textContent = S(n.dataset.t); });
    document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    $('sheetClose').setAttribute('aria-label', S('close'));
    document.title = S('brand');
    setErr(errKey);
    if (data) { render(data); renderPush(); }
  }

  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-lang]');
    if (!b || b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    store.set(lang, LANG_KEY);
    applyLang();
    if (pushState === 'on') currentSub().then((sub) => sub && sendSub(sub)).catch(() => {});
  });
  applyLang();

  function showGate(errK) {
    document.body.classList.remove('in');
    $('app').hidden = true;
    $('gate').hidden = false;
    setErr(errK);
    $('pin').value = '';
    setTimeout(() => $('pin').focus(), 50);
  }

  async function tryOpen(pin) {
    const d = await decrypt(pin, blob); // throws on wrong PIN
    data = d;
    pinNow = pin;
    render(d);
    $('gate').hidden = true;
    $('app').hidden = false;
    document.body.classList.add('in');
    tabNow();
    checkPush();
    return d;
  }

  $('gateForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pin = $('pin').value.trim();
    if (!pin) return;
    $('enter').disabled = true;
    $('enter').textContent = S('opening');
    setErr();
    try {
      if (!blob) blob = await loadBlob();
      await tryOpen(pin);
      store.set(pin);
      window.scrollTo(0, 0);
    } catch (err) {
      data = null;
      setErr(blob ? 'wrongPin' : 'offline');
      $('pin').select();
    } finally {
      $('enter').disabled = false;
      $('enter').textContent = S('enter');
    }
  });

  $('logout').addEventListener('click', () => { store.clear(); data = null; pinNow = null; showGate(); });

  // ---------- Dad's own edits ----------
  // Each change is applied to the latest copy on the Worker, re-encrypted with the
  // PIN and saved with the edit key from inside the plan. A save by Paul in between
  // just means one more try. The Worker then nudges Paul's phones.
  let pinNow = null;
  let busy = false;
  const canEdit = () => !!(data && data.edit && data.edit.key && pinNow);
  const taskKey = (x) => (x.text && typeof x.text === 'object') ? x.text.es : x.text;
  const findTask = (plan, key) => plan.tasks.eduardo.find((x) => taskKey(x) === key);
  const isoToday = () => { const t = new Date(); return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0'); };
  const logText = (k, text) => ({ es: STR.es[k](typeof text === 'object' ? text.es : text), en: STR.en[k](typeof text === 'object' ? (text.en || text.es) : text) });
  let toastTimer = 0;
  function toast(msg, bad) {
    const t = $('toast');
    t.textContent = msg; t.classList.toggle('bad', !!bad); t.hidden = !msg;
    clearTimeout(toastTimer);
    if (msg) toastTimer = setTimeout(() => { t.hidden = true; }, bad ? 6000 : 3500);
  }

  async function commit(kind, mutate) {
    if (busy || !canEdit()) { if (data) render(data); return false; }
    busy = true;
    toast(S('saving'));
    try {
      for (let i = 0; i < 3; i++) {
        const res = await fetch(API + '/api/data', { cache: 'no-store' });
        if (!res.ok) throw new Error('load ' + res.status);
        const doc = await res.json();
        const fresh = await decrypt(pinNow, doc.blob);
        if (mutate(fresh) === false) { toast(''); data = fresh; rev = doc.rev; render(data); return false; }
        fresh.updated = isoToday();
        const b = await encrypt(pinNow, fresh);
        const put = await fetch(API + '/api/data', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + fresh.edit.key },
          body: JSON.stringify({ blob: b, rev: doc.rev, kind }),
        });
        if (put.status === 409) continue;
        const out = await put.json().catch(() => ({}));
        if (!put.ok) throw new Error(out.error || put.status);
        rev = out.rev; blob = b; data = fresh;
        store.set(JSON.stringify(b), BLOB_KEY);
        render(data);
        toast(out.sent ? S('savedDone') : S('savedNo'));
        return true;
      }
      throw new Error('conflict');
    } catch {
      toast(S('saveFail'), true);
      if (data) render(data);
      return false;
    } finally { busy = false; }
  }

  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-done],[data-undo]');
    if (!b) return;
    const undo = b.hasAttribute('data-undo');
    const key = undo ? b.dataset.undo : b.dataset.done;
    const credit = b.dataset.kind === 'credit';
    commit(undo ? 'undo' : 'done', (p) => {
      const x = credit ? ((p.credit && p.credit.steps) || []).find((y) => taskKey(y) === key) : findTask(p, key);
      if (!x || (x.status === 'done') !== undo) return false;
      x.status = undo ? 'todo' : 'done';
      p.log.push({ date: isoToday(), by: 'eduardo', text: logText(undo ? 'logUndo' : 'logDone', x.text) });
    });
  });

  document.addEventListener('submit', async (e) => {
    if (e.target.classList.contains('add-form') || e.target.id === 'addForm') {
      e.preventDefault();
      const input = e.target.querySelector('input');
      const t = input.value.trim();
      if (!t) return;
      const ok = await commit('add', (p) => {
        p.tasks.eduardo.push({ status: 'todo', text: { es: t, en: t }, by: 'eduardo' });
        p.log.push({ date: isoToday(), by: 'eduardo', text: logText('logAdd', t) });
      });
      if (ok) document.querySelectorAll('.add-form input').forEach((i) => { i.value = ''; });
    } else if (e.target.id === 'writeForm') {
      e.preventDefault();
      const t = $('writeText').value.trim();
      if (!t) return;
      const ok = await commit('update', (p) => { p.log.push({ date: isoToday(), by: 'eduardo', text: { es: t, en: t } }); });
      if (ok) $('sheet').close();
    }
  });

  // ---------- push ----------
  // One nudge per phone: "the ball is on your side". The subscription is sent with
  // the push key from inside the plan, so only someone with the PIN can sign up.
  const LATER_KEY = 'plan-regreso-nudge-later';
  const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const pushOk = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  const b64uBytes = (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0));
  const withTimeout = (p, ms) => Promise.race([p, new Promise((_, no) => setTimeout(() => no(new Error('timeout')), ms))]);
  let pushState = 'none';
  let nudgeErr = false;

  async function currentSub() {
    const reg = await withTimeout(navigator.serviceWorker.ready, 4000);
    return reg.pushManager.getSubscription();
  }

  async function checkPush() {
    if (!data || !data.push || !data.push.key) pushState = 'none';
    else if (!pushOk()) pushState = isIos && !standalone() ? 'ios' : 'none';
    else if (Notification.permission === 'denied') pushState = 'denied';
    else { try { pushState = (await currentSub()) ? 'on' : 'off'; } catch { pushState = 'none'; } }
    renderPush();
  }

  function renderPush() {
    const later = Number(store.get(LATER_KEY) || 0);
    const quiet = Date.now() - later < 7 * 864e5;
    const n = $('nudge');
    const showCard = (pushState === 'off' || pushState === 'ios') && !quiet;
    n.hidden = !showCard;
    if (showCard) {
      const acts = el('div', { class: 'acts' },
        pushState === 'off' ? el('button', { class: 'btn-ball', type: 'button', id: 'nudgeYes' }, S('nudgeBtn')) : null,
        el('button', { class: 'later', type: 'button', id: 'nudgeLater' }, S('nudgeLater')),
      );
      n.replaceChildren(ball(), el('div', { class: 'txt' },
        el('b', null, S('nudgeT')),
        el('p', { role: nudgeErr ? 'alert' : null }, nudgeErr ? S('nudgeFail') : pushState === 'ios' ? S('nudgeIos') : S('nudgeP')),
      ), acts);
    }
    const f = $('pushFoot');
    f.hidden = !(pushState === 'on' || pushState === 'denied');
    if (pushState === 'on') f.replaceChildren(S('pushOn'), ' ', el('button', { type: 'button', id: 'pushOffBtn' }, S('pushOff')));
    else if (pushState === 'denied') f.replaceChildren(S('pushDenied'));
  }

  async function sendSub(sub) {
    const res = await fetch(API + '/api/subscribe', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: data.push.key, sub: sub.toJSON(), lang }),
    });
    if (!res.ok) throw new Error('subscribe ' + res.status);
  }

  async function turnOn() {
    nudgeErr = false;
    try {
      const perm = await Notification.requestPermission();
      if (perm !== 'granted') { await checkPush(); return; }
      const reg = await withTimeout(navigator.serviceWorker.ready, 4000);
      const { key } = await (await fetch(API + '/api/vapid')).json();
      const sub = (await reg.pushManager.getSubscription())
        || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uBytes(key) });
      await sendSub(sub);
    } catch { nudgeErr = true; }
    await checkPush();
  }

  async function turnOff() {
    try {
      const sub = await currentSub();
      if (sub) {
        await fetch(API + '/api/unsubscribe', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key: data.push.key, endpoint: sub.endpoint }),
        }).catch(() => {});
        await sub.unsubscribe();
      }
    } catch {}
    store.set(String(Date.now()), LATER_KEY);
    await checkPush();
  }

  document.addEventListener('click', (e) => {
    const id = e.target.closest('button') && e.target.closest('button').id;
    if (id === 'nudgeYes') turnOn();
    else if (id === 'nudgeLater') { store.set(String(Date.now()), LATER_KEY); renderPush(); }
    else if (id === 'pushOffBtn') turnOff();
  });

  // Coming back to the page picks up Paul's latest save.
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState !== 'visible' || !data) return;
    const pin = store.get();
    const before = rev;
    try {
      const b = await loadBlob();
      if (pin && rev !== before) { blob = b; data = await decrypt(pin, b); render(data); }
    } catch {}
  });

  (async () => {
    try { blob = await loadBlob(); }
    catch { showGate('offline'); return; }
    const saved = store.get();
    if (saved) {
      try { await tryOpen(saved); return; }
      catch { store.clear(); data = null; }
    }
    showGate();
  })();

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
