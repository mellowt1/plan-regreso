<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Plan de regreso</title>
<meta name="theme-color" content="#F2F0EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101512" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
:root {
  --bg: #F2F0EA; --surface: #FFFFFF; --ink: #16211C; --muted: #56605A; --line: #DAD6CB; --chip: #E2DFD5;
  --table: #1F6B4F; --table-ink: #CFE8DC; --rim: #FFFFFF;
  --card: #FFFFFF; --card-soft: rgba(255,255,255,.94); --card-ink: #16211C;
  --ball: #FF7A1A; --ball-ink: #B24D00; --peach: #FFD2AE;
  --wait-ink: #7A4D0E; --wait-bg: #F7E8CC; --done: #2F6B4A;
  --score: #16211C; --score-tile: #2A3730; --score-muted: #A9B8B0; --score-ink: #F2F0EA;
  --shadow: 0 24px 50px rgba(22,33,28,.22);
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101512; --surface: #1A221E; --ink: #E9EEE9; --muted: #A5B0A9; --line: #2B3530; --chip: #222B26;
    --table: #1B5A43; --table-ink: #CFE8DC; --rim: #D9E4DD;
    --card: #1A221E; --card-soft: rgba(26,34,30,.94); --card-ink: #E9EEE9;
    --ball-ink: #FF9A4D; --wait-ink: #F0C47A; --wait-bg: #3A2E18; --done: #6CC18D;
    --score: #0A0F0C; --score-tile: #1F2A24;
    --shadow: 0 24px 50px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101512; --surface: #1A221E; --ink: #E9EEE9; --muted: #A5B0A9; --line: #2B3530; --chip: #222B26;
  --table: #1B5A43; --table-ink: #CFE8DC; --rim: #D9E4DD;
  --card: #1A221E; --card-soft: rgba(26,34,30,.94); --card-ink: #E9EEE9;
  --ball-ink: #FF9A4D; --wait-ink: #F0C47A; --wait-bg: #3A2E18; --done: #6CC18D;
  --score: #0A0F0C; --score-tile: #1F2A24;
  --shadow: 0 24px 50px rgba(0,0,0,.45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 var(--body); }
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; }
a { color: inherit; }
[hidden] { display: none !important; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
@media (min-width: 860px) { .wrap { padding: 0 40px; } }

/* Shared bits */
.label { font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
.lang { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--chip); }
.lang button { border: 0; background: none; min-width: 48px; height: 38px; border-radius: 999px; font-weight: 700; font-size: 14px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.ball { width: 40px; height: 40px; border-radius: 50%; background: var(--ball); box-shadow: inset -6px -6px 0 rgba(0,0,0,.12), 0 6px 12px rgba(0,0,0,.3); animation: bob 1.6s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
.dots i { font-style: normal; animation: blink 1.4s infinite; }
.dots i:nth-child(2) { animation-delay: .2s; }
.dots i:nth-child(3) { animation-delay: .4s; }
.btn-ball {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 0 22px;
  border: 0; border-radius: 999px; background: var(--ball); color: #16211C; text-decoration: none; font-weight: 700; font-size: 17px; cursor: pointer;
}
.btn-ball svg { width: 20px; height: 20px; flex: none; }
.tag { display: inline-block; align-self: flex-start; font-size: 13px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--wait-bg); color: var(--wait-ink); }

/* Gate */
.gate { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 72px 20px calc(32px + env(safe-area-inset-bottom)); position: relative; }
.gate .lang { position: absolute; top: calc(16px + env(safe-area-inset-top)); right: 16px; }
.gate-card { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; }
.gate-card .ball { margin-bottom: 12px; }
.gate h1 { font-family: var(--display); font-weight: 800; font-size: 48px; line-height: 1; letter-spacing: -.025em; }
.gate p { color: var(--muted); margin-bottom: 12px; }
.pin {
  width: 100%; font-size: 30px; letter-spacing: .4em; text-align: center; padding: 14px 12px 14px calc(12px + .4em);
  border: 2px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); outline: none;
}
.pin:focus { border-color: var(--table); box-shadow: 0 0 0 4px color-mix(in srgb, var(--table) 25%, transparent); }
.btn { width: 100%; min-height: 56px; border: 0; border-radius: 999px; background: var(--ink); color: var(--bg); font-weight: 700; font-size: 18px; cursor: pointer; }
.btn:disabled { opacity: .6; cursor: default; }
.err { color: var(--wait-ink); min-height: 1.6em; font-weight: 700; text-align: center; }

/* Header */
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: calc(14px + env(safe-area-inset-top)) 0 0; }
.brand { font-family: var(--display); font-weight: 800; font-size: 19px; letter-spacing: -.01em; }
.top .right { display: flex; align-items: center; gap: 16px; }
.top .updated { font-size: 15px; color: var(--muted); }
@media (max-width: 859px) { .top .updated { display: none; } }

.hello { padding: 22px 0 20px; display: flex; flex-direction: column; gap: 6px; }
.hello h1 { font-family: var(--display); font-weight: 800; font-size: clamp(38px, 6vw, 60px); line-height: 1.02; letter-spacing: -.025em; max-width: 18ch; }
.hello .sub { color: var(--muted); font-size: 17px; }
@media (min-width: 860px) { .hello h1 { max-width: none; } .hello .sub { font-size: 18px; } }

/* Overview */
.hero { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 859px) { .hero { grid-template-columns: minmax(0, 1fr); gap: 12px; } }
.panel { background: var(--surface); border-radius: 16px; padding: 20px 22px; min-width: 0; }
@media (max-width: 859px) { .panel { padding: 16px 16px 18px; } }
.panel > .label { color: var(--muted); display: block; margin-bottom: 8px; }
.next { position: relative; border-left: 6px solid var(--ball); display: flex; flex-direction: column; gap: 12px; }
.next > .label { color: var(--ball-ink); margin-bottom: 0; }
.next .step { font-family: var(--display); font-weight: 600; font-size: clamp(23px, 2.6vw, 30px); line-height: 1.2; }
.next .btn-ball { align-self: flex-start; }
.next .tag { margin-top: -4px; }
@media (max-width: 859px) { .next .btn-ball { align-self: stretch; min-height: 56px; } }
.goals { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.goals li { display: flex; align-items: center; gap: 12px; font-weight: 700; line-height: 1.3; }
.goals .n { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--table); color: #fff; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 15px; }

.jump { position: sticky; top: 0; z-index: 4; margin: 20px -16px 0; padding: 10px 16px; background: var(--bg); display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid transparent; }
.jump::-webkit-scrollbar { display: none; }
.jump.stuck { border-bottom-color: var(--line); }
.jump a { flex: none; min-height: 40px; padding: 0 16px; border-radius: 999px; background: var(--chip); display: inline-flex; align-items: center; font-weight: 700; font-size: 15px; text-decoration: none; }
.jump a:hover { background: var(--line); }
@media (min-width: 860px) { .jump { margin: 24px -40px 0; padding: 12px 40px; } }

.sec { margin-top: 32px; scroll-margin-top: 70px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.sec-h h2 { font-family: var(--display); font-weight: 800; font-size: 28px; letter-spacing: -.015em; line-height: 1.1; }
.sec-h .small { color: var(--muted); font-size: 15px; }
.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
.cols3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
@media (max-width: 859px) { .cols, .cols3 { grid-template-columns: minmax(0, 1fr); gap: 12px; } .sec { margin-top: 28px; } .sec-h h2 { font-size: 24px; } }

.who-h { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
.who-h .av { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 17px; background: var(--ink); color: var(--bg); }
.who-h.dad .av { background: var(--ball); color: #16211C; }
.who-h h3 { font-family: var(--display); font-weight: 800; font-size: 21px; margin: 0; }
.who-h .cnt { margin-left: auto; font-size: 15px; color: var(--muted); font-weight: 700; }
.panel .bar { margin: 4px 0 6px; }
.bar.green i { background: var(--done); }
.tag.live { background: color-mix(in srgb, var(--done) 18%, transparent); color: var(--done); }
.tag.next-t { background: var(--peach); color: #6B3300; }

.fundrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 6px 16px; margin-bottom: 16px; }
.fundrow .big { font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1; }
.fundrow .of { color: var(--muted); font-size: 16px; }
.fundrow .bar { grid-column: 1 / -1; height: 12px; margin: 6px 0 0; }
.fundrow .note { grid-column: 1 / -1; color: var(--muted); font-size: 15px; }
.panel h3.card-h { font-family: var(--display); font-weight: 800; font-size: 18px; margin: 0 0 4px; line-height: 1.25; }
.panel .money { margin-top: 4px; font-size: 16px; }
.panel .money td { padding: 7px 0; }
.bigtotal { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1.1; margin: 2px 0 8px; }

.debts { list-style: none; margin: 4px 0 0; padding: 0; }
.debts li { padding: 10px 0; border-top: 1px solid var(--line); font-weight: 700; }
.debts li:first-child { border-top: 0; }
.logs { list-style: none; margin: 0; padding: 0; }
.logs li { padding: 12px 0; border-top: 1px solid var(--line); }
.logs li:first-child { border-top: 0; padding-top: 4px; }
.logs .d { font-weight: 700; color: var(--ball-ink); font-size: 14px; }
.logs-foot { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }

details.more { margin-top: 32px; border-top: 1px solid var(--line); }
details.more summary { list-style: none; cursor: pointer; min-height: 56px; display: flex; align-items: center; justify-content: space-between; font-weight: 700; font-size: 17px; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::after { content: "+"; font-size: 24px; color: var(--muted); }
details.more[open] summary::after { content: "−"; }
details.more .row { display: flex; flex-wrap: wrap; gap: 10px; padding-bottom: 8px; }

/* Push nudge */
.nudge { margin-top: 24px; display: flex; align-items: center; gap: 18px; padding: 18px 22px; border-radius: 12px; background: var(--surface); border: 2px dashed var(--line); }
.nudge .ball { flex: none; width: 34px; height: 34px; }
.nudge .txt { flex-grow: 1; display: flex; flex-direction: column; gap: 2px; }
.nudge b { font-family: var(--display); font-weight: 800; font-size: 20px; line-height: 1.2; }
.nudge p { color: var(--muted); font-size: 16px; }
.nudge .acts { display: flex; gap: 8px; align-items: center; flex: none; }
.nudge .later { background: none; border: 0; color: var(--muted); text-decoration: underline; min-height: 44px; padding: 0 8px; cursor: pointer; }
@media (max-width: 859px) {
  .nudge { flex-wrap: wrap; margin-top: 20px; padding: 16px 18px; gap: 12px 14px; }
  .nudge .txt { flex-basis: calc(100% - 50px); }
  .nudge .acts { flex-basis: 100%; }
  .nudge .acts .btn-ball { flex-grow: 1; }
}
#pushFoot button { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 6px; min-height: 44px; }

footer { padding: 40px 0 calc(40px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; text-align: center; }
footer .sig { font-family: var(--display); font-weight: 600; font-size: 18px; color: var(--ink); }
.link { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 10px; min-height: 44px; }

/* Sheet */
dialog.sheet {
  width: min(720px, 100%); max-height: min(88vh, 900px); margin: auto; padding: 0; border: 0; border-radius: 18px;
  background: var(--bg); color: var(--ink); box-shadow: var(--shadow);
}
dialog.sheet::backdrop { background: rgba(10,15,12,.55); }
@media (max-width: 859px) {
  dialog.sheet { width: 100%; max-width: none; max-height: 92dvh; margin: auto 0 0; border-radius: 18px 18px 0 0; }
}
.sheet-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; background: var(--bg); border-bottom: 1px solid var(--line); }
.sheet-head h2 { font-family: var(--display); font-weight: 800; font-size: 24px; letter-spacing: -.01em; }
.sheet-head button { min-width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--chip); cursor: pointer; display: grid; place-items: center; }
.sheet-head svg { width: 18px; height: 18px; }
.sheet-body { padding: 8px 20px calc(28px + env(safe-area-inset-bottom)); }
.sheet-body h3 { font-family: var(--display); font-weight: 800; font-size: 19px; margin: 22px 0 4px; }
.sheet-body .small { color: var(--muted); font-size: 15px; }
.sheet-body .intro { color: var(--muted); margin: 14px 0 4px; }
ul.list, ol.list { list-style: none; margin: 8px 0 0; padding: 0; }
.list li { display: grid; grid-template-columns: 26px 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.list li:first-child { border-top: 0; }
.box { width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--muted); margin-top: 2px; display: grid; place-items: center; }
.box svg { width: 14px; height: 14px; }
li.done .box { background: var(--done); border-color: var(--done); color: #fff; }
li.done .t { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
li.doing .box { border-color: var(--table); background: linear-gradient(90deg, var(--table) 50%, transparent 50%); }
li.blocked .box { border-color: var(--wait-ink); border-style: dashed; }
li.next .box { border: 2px solid var(--ball); }
.list .tag { margin-top: 6px; }
.phase .num { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 13px; font-weight: 700; color: var(--muted); }
.phase.now .num { background: var(--ball); border-color: var(--ball); color: #16211C; }
.phase.past .num { background: var(--done); border-color: var(--done); color: #fff; }
.phase h4 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 19px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.phase .pill { font-family: var(--body); font-size: 12px; font-weight: 700; background: var(--ball); color: #16211C; padding: 1px 9px; border-radius: 999px; }
.phase .dates { font-size: 14px; color: var(--muted); }
.phase p { margin-top: 6px; }
.phase .goal { margin-top: 8px; font-weight: 700; }
.phase .goal span { color: var(--muted); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; margin-right: 6px; }
.log .d { font-weight: 700; color: var(--ball-ink); font-size: 14px; }
.svc .price { font-weight: 700; color: var(--done); font-size: 15px; }
.svc .price.tbd { color: var(--muted); font-weight: 400; }
.money { width: 100%; border-collapse: collapse; margin-top: 8px; font-variant-numeric: tabular-nums; }
.money td { padding: 9px 0; border-top: 1px solid var(--line); vertical-align: top; }
.money tr:first-child td { border-top: 0; }
.money td:last-child { text-align: right; padding-left: 16px; white-space: nowrap; }
.money tr.total td { border-top: 2px solid var(--ink); font-weight: 700; }
.note-card { margin-top: 10px; padding: 14px 16px; border-radius: 10px; background: var(--surface); border-left: 4px solid var(--ball); }
.note-card .d { font-weight: 700; color: var(--ball-ink); font-size: 14px; margin-bottom: 4px; }
.num-c { width: 26px; height: 26px; border-radius: 50%; background: var(--chip); display: grid; place-items: center; font-size: 13px; font-weight: 700; }

/* Dad's own edits */
.wa-link { align-self: flex-start; min-height: 44px; display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 15px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.wa-link svg { width: 18px; height: 18px; }
.acts-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
.btn-line { display: inline-flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 22px; border: 2px solid var(--ink); border-radius: 999px; background: var(--surface); color: var(--ink); font-weight: 700; font-size: 17px; cursor: pointer; }
.btn-line svg { width: 20px; height: 20px; }
@media (max-width: 859px) { .acts-row { flex-direction: column; } .acts-row > * { justify-content: center; } }
button.box { position: relative; padding: 0; background: none; cursor: pointer; width: 26px; height: 26px; margin-top: 0; color: inherit; }
button.box::after { content: ""; position: absolute; inset: -9px; }
li.done button.box { background: var(--done); border-color: var(--done); color: #fff; }
.addrow { display: flex; gap: 8px; margin-top: 12px; }
.addrow input, .write textarea { flex-grow: 1; min-width: 0; font: inherit; font-size: 17px; color: var(--ink); background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; outline: none; }
.addrow input:focus, .write textarea:focus { border-color: var(--table); }
.addrow button { flex: none; min-height: 52px; padding: 0 18px; border: 0; border-radius: 12px; background: var(--ink); color: var(--bg); font-weight: 700; cursor: pointer; }
.write { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
.write textarea { width: 100%; min-height: 150px; resize: vertical; line-height: 1.45; }
.write .btn-ball { align-self: stretch; }
.by { display: inline-block; margin-left: 8px; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--chip); color: var(--ink); vertical-align: 1px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 20; width: max-content; max-width: calc(100% - 32px); padding: 14px 20px; border-radius: 14px; background: var(--ink); color: var(--bg); font-weight: 700; box-shadow: var(--shadow); text-align: center; }
.toast.bad { background: var(--wait-bg); color: var(--wait-ink); }

@media (prefers-reduced-motion: reduce) { .ball, .dots i { animation: none; } .dots i { opacity: 1; } }
</style>
</head>
<body>

<div class="gate" id="gate" hidden>
  <div class="lang" role="group" aria-label="Idioma / Language"><button type="button" data-lang="es" lang="es">ES</button><button type="button" data-lang="en" lang="en">EN</button></div>
  <form class="gate-card" id="gateForm" autocomplete="off">
    <div class="ball" aria-hidden="true"></div>
    <h1 data-t="gateHi">Hola papá</h1>
    <p data-t="gateAsk">Escribe el PIN que te mandó Paul.</p>
    <input class="pin" id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" aria-label="PIN" autocomplete="off">
    <button class="btn" id="enter" type="submit" data-t="enter">Entrar</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</div>

<main id="app" hidden>
  <div class="wrap">
    <header class="top">
      <span class="brand" data-t="brand">Plan de regreso</span>
      <div class="right">
        <span class="updated" id="updatedTop"></span>
        <div class="lang" role="group" aria-label="Idioma / Language"><button type="button" data-lang="es" lang="es">ES</button><button type="button" data-lang="en" lang="en">EN</button></div>
      </div>
    </header>

    <section class="hello">
      <h1 id="headline"></h1>
      <p class="sub" id="subline"></p>
    </section>

    <section class="hero">
      <div class="panel next" id="nextCard"></div>
      <div class="panel"><span class="label" data-t="goals">Objetivos</span><ol class="goals" id="goals"></ol></div>
    </section>

<script>
(() => {
  const PIN_KEY = 'plan-regreso-pin';
  const LANG_KEY = 'plan-regreso-lang';
  const enc = new TextEncoder();
  const $ = (id) => document.getElementById(id);

  // Storage can throw in private windows. Never let that break the page.
  const store = {
    get(k = PIN_KEY) { try { return localStorage.getItem(k); } catch { return null; } },
    set(v, k = PIN_KEY) { try { localStorage.setItem(k, v); } catch {} },
    clear() { try { localStorage.removeItem(PIN_KEY); } catch {} },
  };

  // ---------- language ----------
  // Fixed labels live here. Content text in plan.json is either a plain
  // string or { es, en }; tr() picks the right one and falls back to Spanish.
  const STR = {
    es: {
      gateHi: 'Hola papá', gateAsk: 'Escribe el PIN que te mandó Paul.', enter: 'Entrar', opening: 'Abriendo',
      wrongPin: 'PIN incorrecto. Prueba otra vez.', offline: 'No hay conexión. Prueba en un momento.',
      brand: 'Plan de regreso',
      headMine: 'La pelota está de tu lado, papá.', headPaul: 'La pelota está del lado de Paul.',
      sub: (date, n, of, t, days) => `${date} · Etapa ${n} de ${of}, ${t} · faltan ${days} días`,
      dad: 'Papá · Quito', paul: 'Paul', dadShort: 'Papá',
      shot: 'Tu golpe ahora', tellPaul: 'Listo, avisar a Paul', wa: (t) => `Hola Paul, listo: ${t}`,
      paulWaits: 'Paul lo espera', nothing: 'Nada pendiente. Descansa.',
      more: (n) => n === 1 ? '+ 1 tarea más tuya' : `+ ${n} tareas más tuyas`,
      paulNow: 'En eso ahora', paulNext: 'Lo siguiente', then: 'Después:', waitsBall: 'Espera tu pelota',
      score: 'Marcador', scoreNote: 'tareas hechas',
      goalNow: 'Meta ahora', daysLeft: (n) => `Quedan ${n} días`, fund: 'Pasaje', of: 'de ',
      toGo: 'Faltan', daysTo: (d) => `días, hasta el ${d}`,
      lTasks: 'Todas las tareas', lPlan: 'El plan completo', lLog: 'Lo que ha pasado', lMore: 'Servicios y reglas',
      yours: 'Lo tuyo', pauls: 'Lo que hace Paul', doneOf: (a, b) => `${a} de ${b} hechas`, waiting: 'En espera', doing: 'En curso',
      now: 'Ahora', goal: 'Meta', range: (a, b) => a + ' al ' + b, noPrice: 'Precio por definir',
      services: 'Los tres servicios', rules: 'Reglas de la casa', close: 'Cerrar',
      goals: 'Objetivos', lMoney: 'Dinero y crédito', total: 'Total', credit: 'Reconstruir el crédito en EE. UU.', debts: 'Deudas',
      dadNotes: 'Notas de papá', budgetNote: 'Números de la hoja que hicimos juntos.',
      markDone: 'Listo, ya lo hice', waPaul: 'Escribir a Paul por WhatsApp',
      writeBtn: 'Escribir una novedad', tickBtn: 'Marcar mis tareas', lWrite: 'Escribir una novedad',
      writeHint: 'Cuéntale a Paul cómo vas, qué averiguaste o qué necesitas. Le llega un aviso.',
      writePh: 'Hoy hablé con...', send: 'Enviar a Paul',
      addPh: 'Una tarea nueva para ti', add: 'Agregar', tickHint: 'Toca el cuadro para marcar una tarea como hecha. Paul recibe un aviso.',
      saving: 'Guardando…', savedDone: 'Hecho. Paul recibió el aviso.', savedNo: 'Guardado. Paul lo verá al abrir el plan.',
      saveFail: 'No se pudo guardar. Revisa la conexión y prueba otra vez.',
      logDone: (t) => 'Terminé: ' + t, logUndo: (t) => 'Volví a abrir: ' + t, logAdd: (t) => 'Nueva tarea: ' + t,
      byDad: 'Papá',
      hi: 'Hola papá', subOv: (date, days, dl) => `${date} · faltan ${days} días, hasta el ${dl}`,
      nextStep: 'Tu próximo paso', allDone: 'Todo hecho. Descansa, o agrega una tarea abajo.',
      secTasks: 'Tareas', secMoney: 'Dinero', secCredit: 'Crédito y deudas', secNotes: 'Notas', secLog: 'Novedades',
      tapBox: 'Toca un cuadro para marcarlo. Paul recibe un aviso.', paulWaitsYou: 'Espera tu parte', upNext: 'Lo siguiente',
      fundT: 'Fondo del pasaje', seeAll: 'Ver todo', noNotes: 'Todavía no hay notas.', moreT: 'Más del plan',
      nudgeT: '¿Te aviso cuando te toque?', nudgeP: 'Un aviso en tu teléfono cuando Paul te devuelva la pelota.',
      nudgeBtn: 'Sí, avísame', nudgeLater: 'Ahora no',
      nudgeIos: 'En iPhone: toca Compartir y después “Añadir a pantalla de inicio”. Abre el plan desde ese ícono y aquí podrás activar los avisos.',
      nudgeFail: 'No se pudo activar. Prueba otra vez más tarde.',
      pushOn: 'Avisos activados en este teléfono.', pushOff: 'Desactivar', pushDenied: 'Los avisos están bloqueados en este navegador.',
      updated: (d) => 'Actualizado el ' + d, sig: 'Hecho por Paul para papá', logout: 'Salir en este equipo',
    },
    en: {
      gateHi: 'Hi Dad', gateAsk: 'Type the PIN Paul sent you.', enter: 'Open', opening: 'Opening',
      wrongPin: 'Wrong PIN. Try again.', offline: 'No connection. Try again in a moment.',
      brand: 'The way back',
      headMine: 'The ball is on your side, Dad.', headPaul: 'The ball is on Paul’s side.',
      sub: (date, n, of, t, days) => `${date} · Stage ${n} of ${of}, ${t} · ${days} days to go`,
      dad: 'Dad · Quito', paul: 'Paul', dadShort: 'Dad',
      shot: 'Your shot now', tellPaul: 'Done, tell Paul', wa: (t) => `Hi Paul, done: ${t}`,
      paulWaits: 'Paul is waiting on this', nothing: 'Nothing left to do. Rest.',
      more: (n) => n === 1 ? '+ 1 more of your tasks' : `+ ${n} more of your tasks`,
      paulNow: 'On it now', paulNext: 'Up next', then: 'Then:', waitsBall: 'Waiting for your ball',
      score: 'Score', scoreNote: 'tasks done',
      goalNow: 'Goal right now', daysLeft: (n) => `${n} days left`, fund: 'Ticket fund', of: 'of ',
      toGo: 'To go', daysTo: (d) => `days, until ${d}`,
      lTasks: 'All tasks', lPlan: 'The full plan', lLog: 'What has happened', lMore: 'Services and rules',
      yours: 'Yours', pauls: 'What Paul does', doneOf: (a, b) => `${a} of ${b} done`, waiting: 'Waiting', doing: 'In progress',
      now: 'Now', goal: 'Goal', range: (a, b) => a + ' to ' + b, noPrice: 'Price to be set',
      services: 'The three services', rules: 'House rules', close: 'Close',
      goals: 'Goals', lMoney: 'Money and credit', total: 'Total', credit: 'Rebuild US credit', debts: 'Debts',
      dadNotes: 'Dad’s notes', budgetNote: 'Numbers from the sheet we made together.',
      markDone: 'Done, I did it', waPaul: 'Message Paul on WhatsApp',
      writeBtn: 'Write an update', tickBtn: 'Tick off my tasks', lWrite: 'Write an update',
      writeHint: 'Tell Paul how it is going, what you found out or what you need. He gets a notification.',
      writePh: 'Today I talked to...', send: 'Send to Paul',
      addPh: 'A new task for you', add: 'Add', tickHint: 'Tap the box to mark a task as done. Paul gets a notification.',
      saving: 'Saving…', savedDone: 'Done. Paul got the notification.', savedNo: 'Saved. Paul will see it when he opens the plan.',
      saveFail: 'Could not save. Check the connection and try again.',
      logDone: (t) => 'Done: ' + t, logUndo: (t) => 'Reopened: ' + t, logAdd: (t) => 'New task: ' + t,
      byDad: 'Dad',
      hi: 'Hi Dad', subOv: (date, days, dl) => `${date} · ${days} days to go, until ${dl}`,
      nextStep: 'Your next step', allDone: 'All done. Rest, or add a task below.',
      secTasks: 'Tasks', secMoney: 'Money', secCredit: 'Credit and debts', secNotes: 'Notes', secLog: 'Updates',
      tapBox: 'Tap a box to tick it. Paul gets a notification.', paulWaitsYou: 'Waiting on you', upNext: 'Up next',
      fundT: 'Ticket fund', seeAll: 'See all', noNotes: 'No notes yet.', moreT: 'More of the plan',
      nudgeT: 'Want a nudge when it is your turn?', nudgeP: 'A notification on your phone when Paul sends the ball back.',
      nudgeBtn: 'Yes, notify me', nudgeLater: 'Not now',
      nudgeIos: 'On iPhone: tap Share, then “Add to Home Screen”. Open the plan from that icon and you can turn on notifications here.',
      nudgeFail: 'Could not turn it on. Try again later.',
      pushOn: 'Notifications are on for this phone.', pushOff: 'Turn off', pushDenied: 'Notifications are blocked in this browser.',
      updated: (d) => 'Updated ' + d, sig: 'Made by Paul for Dad', logout: 'Sign out on this device',
    },
  };
  const pickLang = () => {
    const saved = store.get(LANG_KEY);
    if (saved === 'es' || saved === 'en') return saved;
    return /^es\b/i.test(navigator.language || 'es') ? 'es' : 'en';
  };
  let lang = pickLang();
  const S = (k) => STR[lang][k];
  const tr = (v) => (v == null || typeof v !== 'object') ? v : (v[lang] || v.es);

  const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

  const b64 = (buf) => { let s = ''; new Uint8Array(buf).forEach((c) => { s += String.fromCharCode(c); }); return btoa(s); };
  async function keyFor(pin, salt, iter) {
    const base = await crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: iter }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }
  async function decrypt(pin, blob) {
    const key = await keyFor(pin, unb64(blob.salt), blob.iter);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(blob.iv) }, key, unb64(blob.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  // Same scheme as build.mjs, used when Dad saves a change himself.
  async function encrypt(pin, obj) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await keyFor(pin, salt, 200000), enc.encode(JSON.stringify(obj)));
    return { v: 1, iter: 200000, salt: b64(salt), iv: b64(iv), ct: b64(ct) };
  }

  // The plan lives on the Worker (edited from admin.html). data.json is the
  // fallback, and the last ciphertext is kept so the page opens offline.
  const API = 'https://plan-regreso.paul-o-a04.workers.dev';
  const BLOB_KEY = 'plan-regreso-blob';
  let rev = 0;
  async function loadBlob() {
    try {
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 6000);
      const res = await fetch(API + '/api/data', { cache: 'no-store', signal: ctl.signal });
      clearTimeout(timer);
      if (res.ok) {
        const doc = await res.json();
        rev = doc.rev;
        store.set(JSON.stringify(doc.blob), BLOB_KEY);
        return doc.blob;
      }
    } catch {}
    const cached = store.get(BLOB_KEY);
    if (cached) { try { return JSON.parse(cached); } catch {} }
    const res = await fetch('data.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error('data ' + res.status);
    return res.json();
  }

  // ---------- helpers ----------
  function el(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') n.className = v; else n.setAttribute(k, v);
    }
    for (const k of kids.flat()) if (k != null && k !== false) n.append(k.nodeType ? k : String(k));
    return n;
  }
  const svg = (inner, vb = '0 0 16 16') => {
    const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('viewBox', vb); s.setAttribute('aria-hidden', 'true'); s.innerHTML = inner;
    return s;
  };
  const check = () => svg('<path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>');
  const chat = () => svg('<path d="M21 11.5a8.4 8.4 0 0 1-12.3 7.4L3 21l2.1-5.5A8.4 8.4 0 1 1 21 11.5z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M8.5 11.5l2.3 2.3 4.7-4.6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>', '0 0 24 24');
  const ball = () => el('div', { class: 'ball', 'aria-hidden': 'true' });
  const pencil = () => svg('<path d="M4 20h4L19 9l-4-4L4 16v4z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>', '0 0 24 24');

  const day = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const today = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };
  const loc = () => (lang === 'es' ? 'es-EC' : 'en-GB');
  const fmtDay = (s, opts) => day(s).toLocaleDateString(loc(), opts || { day: 'numeric', month: 'long' });
  const daysUntil = (s, t) => Math.max(0, Math.round((day(s) - t) / 864e5));
  const money = (n) => '$' + String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, lang === 'es' ? '.' : ',');
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

  function phaseState(p, t) {
    if (t >= day(p.to)) return 'past';
    if (t >= day(p.from)) return 'now';
    return 'next';
  }
  function currentPhase(phases, t) {
    return phases.find((p) => phaseState(p, t) === 'now')
      || (t < day(phases[0].from) ? phases[0] : phases[phases.length - 1]);
  }
  const open = (list) => list.filter((x) => x.status !== 'done');
  const nextOf = (list) => list.find((x) => x.status === 'doing') || list.find((x) => x.status === 'todo');

  // ---------- render ----------
  // One page, in the order of the sheet: goals, both task columns, money,
  // credit and debts, Dad's notes, updates.
  const doneFirstLast = (list) => [...list.filter((x) => x.status !== 'done'), ...list.filter((x) => x.status === 'done')];

  function checklist(list, kind, editable, next) {
    return el('ul', { class: 'list' }, doneFirstLast(list).map((x) => {
      const done = x.status === 'done';
      return el('li', { class: x.status + (x === next ? ' next' : '') },
        editable
          ? el('button', { class: 'box', type: 'button', role: 'checkbox', 'aria-checked': String(done), 'aria-label': tr(x.text), [done ? 'data-undo' : 'data-done']: taskKey(x), 'data-kind': kind }, done ? check() : null)
          : el('span', { class: 'box', 'aria-hidden': 'true' }, done ? check() : null),
        el('div', null,
          el('div', { class: 't' }, tr(x.text)),
          x === next && kind === 'task' ? el('span', { class: 'tag next-t' }, S('nextStep')) : null,
          x.status === 'doing' ? el('span', { class: 'tag live' }, tr(x.note) || S('paulNow')) : null,
          x.status === 'blocked' ? el('span', { class: 'tag' }, tr(x.note) || S('paulWaitsYou')) : null,
          x.paulWaits && !done ? el('span', { class: 'tag' }, S('paulWaits')) : null,
        ));
    }));
  }

  function whoHead(cls, initial, name, list) {
    const n = list.filter((x) => x.status === 'done').length;
    const bar = el('div', { class: 'bar green', role: 'progressbar', 'aria-valuemin': 0, 'aria-valuemax': list.length, 'aria-valuenow': n, 'aria-label': name }, el('i'));
    bar.firstChild.style.width = (list.length ? (n / list.length) * 100 : 0) + '%';
    return [el('div', { class: 'who-h ' + cls }, el('span', { class: 'av', 'aria-hidden': 'true' }, initial), el('h3', null, name), el('span', { class: 'cnt' }, S('doneOf')(n, list.length))), bar];
  }

  const longDay = (s) => cap(fmtDay(s, { weekday: 'long', day: 'numeric', month: 'long' }).replace(',', ''));

  function render(d) {
    const t = today();
    const mine = d.tasks.eduardo, pauls = d.tasks.paul;
    const next = nextOf(mine);
    const edit = canEdit();

    const upd = S('updated')(fmtDay(d.updated));
    $('updatedTop').textContent = upd;
    $('updatedFoot').textContent = upd;
    $('headline').textContent = S('hi');
    const todayTxt = cap(t.toLocaleDateString(loc(), { weekday: 'long', day: 'numeric', month: 'long' }).replace(',', ''));
    $('subline').textContent = S('subOv')(todayTxt, daysUntil(d.deadline, t), fmtDay(d.deadline, { day: 'numeric', month: 'long' }));

    // Next step
    const wa = next && d.contact && d.contact.whatsapp
      ? 'https://wa.me/' + d.contact.whatsapp + '?text=' + encodeURIComponent(S('wa')(tr(next.text))) : null;
    $('nextCard').replaceChildren(...(next ? [
      el('span', { class: 'label' }, S('nextStep')),
      el('p', { class: 'step' }, tr(next.text)),
      next.paulWaits ? el('span', { class: 'tag' }, S('paulWaits')) : null,
      edit ? el('button', { class: 'btn-ball', type: 'button', 'data-done': taskKey(next), 'data-kind': 'task' }, check(), S('markDone'))
        : wa ? el('a', { class: 'btn-ball', href: wa, target: '_blank', rel: 'noopener' }, chat(), S('tellPaul')) : null,
      edit && wa ? el('a', { class: 'wa-link', href: wa, target: '_blank', rel: 'noopener' }, chat(), S('waPaul')) : null,
    ] : [el('span', { class: 'label' }, S('nextStep')), el('p', { class: 'step' }, S('allDone'))]).filter(Boolean));

    const goals = d.objectives || [];
    $('goals').replaceChildren(...goals.map((g, i) => el('li', null, el('span', { class: 'n', 'aria-hidden': 'true' }, i + 1), tr(g))));

    // Tasks, side by side like the sheet
    $('tasksHint').textContent = edit ? S('tapBox') : '';
    $('dadTasks').replaceChildren(
      ...whoHead('dad', 'E', S('dadShort'), mine),
      checklist(mine, 'task', edit, next),
      edit ? el('form', { class: 'addrow', id: 'addForm' },
        el('input', { id: 'addText', type: 'text', placeholder: S('addPh'), 'aria-label': S('addPh'), maxlength: 200, enterkeyhint: 'done' }),
        el('button', { type: 'submit' }, S('add'))) : null,
    );
    $('paulTasks').replaceChildren(...whoHead('paul', 'P', 'Paul', pauls), checklist(pauls, 'paul', false, null));

    // Money
    const f = d.fund;
    const pct = f.target ? Math.min(100, (f.saved / f.target) * 100) : 0;
    const bar = el('div', { class: 'bar', role: 'progressbar', 'aria-valuemin': 0, 'aria-valuemax': f.target, 'aria-valuenow': f.saved, 'aria-label': S('fundT') }, el('i'));
    bar.firstChild.style.width = pct + '%';
    $('fund').replaceChildren(el('div', { class: 'fundrow' },
      el('span', null, el('span', { class: 'label', style: 'display:block;color:var(--muted);margin-bottom:6px' }, S('fundT')), el('span', { class: 'big' }, money(f.saved))),
      el('span', { class: 'of' }, S('of') + money(f.target)),
      bar,
      f.note ? el('p', { class: 'note' }, tr(f.note)) : null,
    ));
    const groups = (d.budget && d.budget.groups) || [];
    $('s-money').querySelector('.sec-h .small').hidden = !groups.length;
    $('budget').replaceChildren(...groups.map((g) => el('div', { class: 'panel' },
      el('h3', { class: 'card-h' }, tr(g.title)),
      g.total != null ? el('div', { class: 'bigtotal' }, money(g.total)) : null,
      el('table', { class: 'money' }, el('tbody', null, g.items.map(([label, n]) => el('tr', null, el('td', null, tr(label)), el('td', null, money(n)))))),
    )));

    // Credit and debts
    $('s-credit').hidden = !d.credit;
    if (d.credit) {
      $('credit').replaceChildren(el('h3', { class: 'card-h' }, S('credit')), checklist(d.credit.steps || [], 'credit', edit, null));
      $('debts').replaceChildren(el('h3', { class: 'card-h' }, S('debts')), el('ul', { class: 'debts' }, (d.credit.debts || []).map((x) => el('li', null, tr(x)))));
    }

    // Dad's notes
    const notes = d.dadNotes || [];
    $('notes').replaceChildren(...(notes.length ? notes.map((n) => el('div', { class: 'note-card' },
      n.date ? el('div', { class: 'd' }, longDay(n.date)) : null, el('p', null, tr(n.text)))) : [el('p', { class: 'small' }, S('noNotes'))]));

    // Updates: newest few, the rest in a sheet
    const logs = [...d.log].sort((a, b) => b.date.localeCompare(a.date));
    $('log').replaceChildren(
      el('ol', { class: 'logs' }, logs.slice(0, 4).map((x) => el('li', null,
        el('div', { class: 'd' }, longDay(x.date), x.by === 'eduardo' ? el('span', { class: 'by' }, S('byDad')) : null),
        el('p', null, tr(x.text))))),
      el('div', { class: 'logs-foot' },
        edit ? el('button', { class: 'btn-ball', type: 'button', 'data-sheet': 'write' }, pencil(), S('writeBtn')) : null,
        logs.length > 4 ? el('button', { class: 'btn-line', type: 'button', 'data-sheet': 'log' }, S('seeAll') + ' (' + logs.length + ')') : null),
    );

    if (sheetKind && sheetKind !== 'write' && $('sheet').open) fillSheet(sheetKind);
  }

  // ---------- sheets ----------
  let sheetKind = null;

  function taskList(list) {
    const order = { blocked: 0, doing: 1, todo: 2, done: 3 };
    const next = nextOf(list);
    const mine = list === data.tasks.eduardo && canEdit();
    return el('ul', { class: 'list' }, [...list].sort((a, b) => order[a.status] - order[b.status]).map((x) =>
      el('li', { class: x.status + (x === next && list === data.tasks.eduardo ? ' next' : '') },
        mine
          ? el('button', { class: 'box', type: 'button', role: 'checkbox', 'aria-checked': String(x.status === 'done'), 'aria-label': tr(x.text), [x.status === 'done' ? 'data-undo' : 'data-done']: taskKey(x) }, x.status === 'done' ? check() : null)
          : el('span', { class: 'box', 'aria-hidden': 'true' }, x.status === 'done' ? check() : null),
        el('div', null,
          el('div', { class: 't' }, tr(x.text)),
          x.status === 'blocked' ? el('span', { class: 'tag' }, tr(x.note) || S('waiting')) : null,
          x.status === 'doing' ? el('span', { class: 'tag' }, tr(x.note) || S('doing')) : null,
          x.paulWaits && x.status !== 'done' ? el('span', { class: 'tag' }, S('paulWaits')) : null,
        ),
      )));
  }

  function fillSheet(kind) {
    const d = data, t = today();
    const body = [];
    let title = '';
    const count = (l) => S('doneOf')(l.filter((x) => x.status === 'done').length, l.length);
    if (kind === 'tasks') {
      title = S('lTasks');
      body.push(el('h3', null, S('yours')), el('p', { class: 'small' }, count(d.tasks.eduardo) + (canEdit() ? '. ' + S('tickHint') : '')), taskList(d.tasks.eduardo));
      if (canEdit()) body.push(el('form', { class: 'addrow', id: 'addForm' },
        el('input', { id: 'addText', type: 'text', placeholder: S('addPh'), 'aria-label': S('addPh'), maxlength: 200, enterkeyhint: 'done' }),
        el('button', { type: 'submit' }, S('add'))));
      body.push(el('h3', null, S('pauls')), el('p', { class: 'small' }, count(d.tasks.paul)), taskList(d.tasks.paul));
    } else if (kind === 'plan') {
      title = S('lPlan');
      const ph = currentPhase(d.phases, t);
      body.push(el('p', { class: 'intro' }, tr(d.intro)));
      body.push(el('ol', { class: 'list' }, d.phases.map((p) => {
        const s = phaseState(p, t);
        const state = p === ph && s !== 'past' ? 'now' : s;
        return el('li', { class: 'phase ' + state },
          el('span', { class: 'num', 'aria-hidden': 'true' }, state === 'past' ? check() : p.n),
          el('div', null,
            el('h4', null, tr(p.title), state === 'now' ? el('span', { class: 'pill' }, S('now')) : null),
            el('div', { class: 'dates' }, S('range')(fmtDay(p.from), fmtDay(p.to))),
            el('p', null, tr(p.summary)),
            el('p', { class: 'goal' }, el('span', null, S('goal')), tr(p.goal)),
          ),
        );
      })));
      if (d.dadNotes && d.dadNotes.length) {
        body.push(el('h3', null, S('dadNotes')), ...d.dadNotes.map((n) => el('div', { class: 'note-card' },
          n.date ? el('div', { class: 'd' }, cap(fmtDay(n.date, { weekday: 'long', day: 'numeric', month: 'long' }).replace(',', ''))) : null,
          el('p', null, tr(n.text)))));
      }
    } else if (kind === 'write') {
      title = S('lWrite');
      body.push(el('form', { class: 'write', id: 'writeForm' },
        el('p', { class: 'small' }, S('writeHint')),
        el('textarea', { id: 'writeText', placeholder: S('writePh'), 'aria-label': S('lWrite'), maxlength: 2000 }),
        el('button', { class: 'btn-ball', type: 'submit' }, S('send'))));
    } else if (kind === 'money') {
      title = S('lMoney');
      if (d.budget) {
        body.push(el('p', { class: 'intro' }, S('budgetNote')));
        d.budget.groups.forEach((g) => body.push(el('h3', null, tr(g.title)), el('table', { class: 'money' }, el('tbody', null,
          g.items.map(([label, n]) => el('tr', null, el('td', null, tr(label)), el('td', null, money(n)))),
          g.total != null ? el('tr', { class: 'total' }, el('td', null, S('total')), el('td', null, money(g.total))) : null,
        ))));
      }
      if (d.credit) {
        body.push(el('h3', null, S('credit')), el('ul', { class: 'list' }, d.credit.steps.map((x) =>
          el('li', { class: x.status }, el('span', { class: 'box', 'aria-hidden': 'true' }, x.status === 'done' ? check() : null), el('div', { class: 't' }, tr(x.text))))));
        if (d.credit.debts && d.credit.debts.length) body.push(el('h3', null, S('debts')), el('ul', { class: 'list' }, d.credit.debts.map((x) =>
          el('li', { style: 'grid-template-columns: 1fr' }, el('span', null, tr(x))))));
      }
    } else if (kind === 'log') {
      title = S('lLog');
      body.push(el('ol', { class: 'list log' }, [...d.log].sort((a, b) => b.date.localeCompare(a.date)).map((x) =>
        el('li', { style: 'grid-template-columns: 1fr' },
          el('div', null, el('div', { class: 'd' }, cap(fmtDay(x.date, { weekday: 'long', day: 'numeric', month: 'long' }).replace(',', '')), x.by === 'eduardo' ? el('span', { class: 'by' }, S('byDad')) : null), el('p', null, tr(x.text))),
        ))));
    } else {
      title = S('lMore');
      body.push(el('h3', null, S('services')), el('ol', { class: 'list' }, d.services.map((s, i) => el('li', { class: 'svc' },
        el('span', { class: 'num-c' }, i + 1),
        el('div', null,
          el('b', null, tr(s.name)),
          s.price != null ? el('div', { class: 'price' }, typeof s.price === 'number' ? money(s.price) : tr(s.price)) : el('div', { class: 'price tbd' }, S('noPrice')),
          el('p', { class: 'small' }, tr(s.what)),
        ),
      ))));
      body.push(el('h3', null, S('rules')), el('ol', { class: 'list' }, d.rules.map((r, i) => el('li', null, el('span', { class: 'num-c' }, i + 1), el('p', null, tr(r))))));
    }
    $('sheetTitle').textContent = title;
    $('sheetBody').replaceChildren(...body);
  }

  function openSheet(kind) {
    if (!data) return;
    sheetKind = kind;
    fillSheet(kind);
    const dlg = $('sheet');
    if (!dlg.open) dlg.showModal();
    $('sheetBody').scrollTop = 0;
    if (kind === 'write') setTimeout(() => $('writeText') && $('writeText').focus(), 60);
  }

  const jumpLine = () => { const j = $('jump'); if (j) j.classList.toggle('stuck', j.getBoundingClientRect().top <= 0 && scrollY > 0); };
  addEventListener('scroll', jumpLine, { passive: true });

  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-sheet]');
    if (b) openSheet(b.dataset.sheet);
  });
  $('sheetClose').addEventListener('click', () => $('sheet').close());
  $('sheet').addEventListener('click', (e) => { if (e.target === $('sheet')) $('sheet').close(); });
  $('sheet').addEventListener('close', () => { sheetKind = null; });

  // ---------- flow ----------
  let blob = null;
  let data = null;   // last decrypted plan, kept so a language switch can re-render
  let errKey = '';   // error shown on the gate, by key so it follows the language

  function setErr(k) { errKey = k || ''; $('err').textContent = errKey ? S(errKey) : ''; }

  // Fixed labels, html lang and the switch state
  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-t]').forEach((n) => { n.textContent = S(n.dataset.t); });
    document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    $('sheetClose').setAttribute('aria-label', S('close'));
    document.title = S('brand');
    setErr(errKey);
    if (data) { render(data); renderPush(); }
  }

  document.querySelectorAll('[data-lang]').forEach((b) => b.addEventListener('click', () => {
    if (b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    store.set(lang, LANG_KEY);
    applyLang();
    if (pushState === 'on') currentSub().then((sub) => sub && sendSub(sub)).catch(() => {});
  }));
  applyLang();

  function showGate(errK) {
    $('app').hidden = true;
    $('gate').hidden = false;
    setErr(errK);
    $('pin').value = '';
    setTimeout(() => $('pin').focus(), 50);
  }

  async function tryOpen(pin) {
    const d = await decrypt(pin, blob); // throws on wrong PIN
    data = d;
    pinNow = pin;
    render(d);
    $('gate').hidden = true;
    $('app').hidden = false;
    checkPush();
    return d;
  }

  $('gateForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pin = $('pin').value.trim();
    if (!pin) return;
    $('enter').disabled = true;
    $('enter').textContent = S('opening');
    setErr();
    try {
      if (!blob) blob = await loadBlob();
      await tryOpen(pin);
      store.set(pin);
      window.scrollTo(0, 0);
    } catch (err) {
      data = null;
      setErr(blob ? 'wrongPin' : 'offline');
      $('pin').select();
    } finally {
      $('enter').disabled = false;
      $('enter').textContent = S('enter');
    }
  });

  $('logout').addEventListener('click', () => { store.clear(); data = null; pinNow = null; showGate(); });

  // ---------- Dad's own edits ----------
  // Each change is applied to the latest copy on the Worker, re-encrypted with the
  // PIN and saved with the edit key from inside the plan. A save by Paul in between
  // just means one more try. The Worker then nudges Paul's phones.
  let pinNow = null;
  let busy = false;
  const canEdit = () => !!(data && data.edit && data.edit.key && pinNow);
  const taskKey = (x) => (x.text && typeof x.text === 'object') ? x.text.es : x.text;
  const findTask = (plan, key) => plan.tasks.eduardo.find((x) => taskKey(x) === key);
  const isoToday = () => { const t = new Date(); return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0'); };
  const logText = (k, text) => ({ es: STR.es[k](typeof text === 'object' ? text.es : text), en: STR.en[k](typeof text === 'object' ? (text.en || text.es) : text) });
  let toastTimer = 0;
  function toast(msg, bad) {
    const t = $('toast');
    t.textContent = msg; t.classList.toggle('bad', !!bad); t.hidden = !msg;
    clearTimeout(toastTimer);
    if (msg) toastTimer = setTimeout(() => { t.hidden = true; }, bad ? 6000 : 3500);
  }

  async function commit(kind, mutate) {
    if (busy || !canEdit()) return false;
    busy = true;
    toast(S('saving'));
    try {
      for (let i = 0; i < 3; i++) {
        const res = await fetch(API + '/api/data', { cache: 'no-store' });
        if (!res.ok) throw new Error('load ' + res.status);
        const doc = await res.json();
        const fresh = await decrypt(pinNow, doc.blob);
        if (mutate(fresh) === false) { toast(''); data = fresh; rev = doc.rev; render(data); return false; }
        fresh.updated = isoToday();
        const b = await encrypt(pinNow, fresh);
        const put = await fetch(API + '/api/data', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + fresh.edit.key },
          body: JSON.stringify({ blob: b, rev: doc.rev, kind }),
        });
        if (put.status === 409) continue;
        const out = await put.json().catch(() => ({}));
        if (!put.ok) throw new Error(out.error || put.status);
        rev = out.rev; blob = b; data = fresh;
        store.set(JSON.stringify(b), BLOB_KEY);
        render(data);
        toast(out.sent ? S('savedDone') : S('savedNo'));
        return true;
      }
      throw new Error('conflict');
    } catch {
      toast(S('saveFail'), true);
      return false;
    } finally { busy = false; }
  }

  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-done],[data-undo]');
    if (!b) return;
    const undo = b.hasAttribute('data-undo');
    const key = undo ? b.dataset.undo : b.dataset.done;
    const credit = b.dataset.kind === 'credit';
    commit(undo ? 'undo' : 'done', (p) => {
      const x = credit ? ((p.credit && p.credit.steps) || []).find((y) => taskKey(y) === key) : findTask(p, key);
      if (!x || (x.status === 'done') !== undo) return false;
      x.status = undo ? 'todo' : 'done';
      p.log.push({ date: isoToday(), by: 'eduardo', text: logText(undo ? 'logUndo' : 'logDone', x.text) });
    });
  });

  document.addEventListener('submit', async (e) => {
    if (e.target.id === 'addForm') {
      e.preventDefault();
      const t = $('addText').value.trim();
      if (!t) return;
      const ok = await commit('add', (p) => {
        p.tasks.eduardo.push({ status: 'todo', text: { es: t, en: t }, by: 'eduardo' });
        p.log.push({ date: isoToday(), by: 'eduardo', text: logText('logAdd', t) });
      });
      if (ok && $('addText')) $('addText').value = '';
    } else if (e.target.id === 'writeForm') {
      e.preventDefault();
      const t = $('writeText').value.trim();
      if (!t) return;
      const ok = await commit('update', (p) => { p.log.push({ date: isoToday(), by: 'eduardo', text: { es: t, en: t } }); });
      if (ok) $('sheet').close();
    }
  });

  // ---------- push ----------
  // One nudge per phone: "the ball is on your side". The subscription is sent with
  // the push key from inside the plan, so only someone with the PIN can sign up.
  const LATER_KEY = 'plan-regreso-nudge-later';
  const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const pushOk = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  const b64uBytes = (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0));
  const withTimeout = (p, ms) => Promise.race([p, new Promise((_, no) => setTimeout(() => no(new Error('timeout')), ms))]);
  let pushState = 'none';
  let nudgeErr = false;

  async function currentSub() {
    const reg = await withTimeout(navigator.serviceWorker.ready, 4000);
    return reg.pushManager.getSubscription();
  }

  async function checkPush() {
    if (!data || !data.push || !data.push.key) pushState = 'none';
    else if (!pushOk()) pushState = isIos && !standalone() ? 'ios' : 'none';
    else if (Notification.permission === 'denied') pushState = 'denied';
    else { try { pushState = (await currentSub()) ? 'on' : 'off'; } catch { pushState = 'none'; } }
    renderPush();
  }

  function renderPush() {
    const later = Number(store.get(LATER_KEY) || 0);
    const quiet = Date.now() - later < 7 * 864e5;
    const n = $('nudge');
    const showCard = (pushState === 'off' || pushState === 'ios') && !quiet;
    n.hidden = !showCard;
    if (showCard) {
      const acts = el('div', { class: 'acts' },
        pushState === 'off' ? el('button', { class: 'btn-ball', type: 'button', id: 'nudgeYes' }, S('nudgeBtn')) : null,
        el('button', { class: 'later', type: 'button', id: 'nudgeLater' }, S('nudgeLater')),
      );
      n.replaceChildren(ball(), el('div', { class: 'txt' },
        el('b', null, S('nudgeT')),
        el('p', { role: nudgeErr ? 'alert' : null }, nudgeErr ? S('nudgeFail') : pushState === 'ios' ? S('nudgeIos') : S('nudgeP')),
      ), acts);
    }
    const f = $('pushFoot');
    f.hidden = !(pushState === 'on' || pushState === 'denied');
    if (pushState === 'on') f.replaceChildren(S('pushOn'), ' ', el('button', { type: 'button', id: 'pushOffBtn' }, S('pushOff')));
    else if (pushState === 'denied') f.replaceChildren(S('pushDenied'));
  }

  async function sendSub(sub) {
    const res = await fetch(API + '/api/subscribe', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: data.push.key, sub: sub.toJSON(), lang }),
    });
    if (!res.ok) throw new Error('subscribe ' + res.status);
  }

  async function turnOn() {
    nudgeErr = false;
    try {
      const perm = await Notification.requestPermission();
      if (perm !== 'granted') { await checkPush(); return; }
      const reg = await withTimeout(navigator.serviceWorker.ready, 4000);
      const { key } = await (await fetch(API + '/api/vapid')).json();
      const sub = (await reg.pushManager.getSubscription())
        || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uBytes(key) });
      await sendSub(sub);
    } catch { nudgeErr = true; }
    await checkPush();
  }

  async function turnOff() {
    try {
      const sub = await currentSub();
      if (sub) {
        await fetch(API + '/api/unsubscribe', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key: data.push.key, endpoint: sub.endpoint }),
        }).catch(() => {});
        await sub.unsubscribe();
      }
    } catch {}
    store.set(String(Date.now()), LATER_KEY);
    await checkPush();
  }

  document.addEventListener('click', (e) => {
    const id = e.target.closest('button') && e.target.closest('button').id;
    if (id === 'nudgeYes') turnOn();
    else if (id === 'nudgeLater') { store.set(String(Date.now()), LATER_KEY); renderPush(); }
    else if (id === 'pushOffBtn') turnOff();
  });

  // Coming back to the page picks up Paul's latest save.
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState !== 'visible' || !data) return;
    const pin = store.get();
    const before = rev;
    try {
      const b = await loadBlob();
      if (pin && rev !== before) { blob = b; data = await decrypt(pin, b); render(data); }
    } catch {}
  });

  (async () => {
    try { blob = await loadBlob(); }
    catch { showGate('offline'); return; }
    const saved = store.get();
    if (saved) {
      try { await tryOpen(saved); return; }
      catch { store.clear(); data = null; }
    }
    showGate();
  })();

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
