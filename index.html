<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Plan de regreso</title>
<meta name="theme-color" content="#F6F4EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12161C" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --bg: #F6F4EF;
  --surface: #FFFFFF;
  --ink: #1C2430;
  --muted: #5B6573;
  --faint: #8A929E;
  --line: #E3DFD6;
  --accent: #1E5A8A;
  --accent-soft: #E6EEF5;
  --done: #2E7D4F;
  --done-soft: #E5F2EA;
  --blocked: #9A6212;
  --blocked-soft: #FBF0DD;
  --radius: 12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161C; --surface: #1A2029; --ink: #E8ECF1; --muted: #A3ADBA; --faint: #7A8494;
    --line: #2A323D; --accent: #7DB3E3; --accent-soft: #1D2B3A;
    --done: #6CC18D; --done-soft: #1B2D23; --blocked: #E6B25C; --blocked-soft: #33291A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161C; --surface: #1A2029; --ink: #E8ECF1; --muted: #A3ADBA; --faint: #7A8494;
  --line: #2A323D; --accent: #7DB3E3; --accent-soft: #1D2B3A;
  --done: #6CC18D; --done-soft: #1B2D23; --blocked: #E6B25C; --blocked-soft: #33291A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; scroll-padding-top: 72px; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 17px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-variant-numeric: tabular-nums;
}
.wrap { max-width: 720px; margin: 0 auto; padding: 0 16px; }
h1, h2, h3 { line-height: 1.25; margin: 0; }
h2 { font-size: 13px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
p { margin: 0; }
button { font: inherit; }
[hidden] { display: none !important; }

/* Gate */
.gate { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; }
.gate-card { width: 100%; max-width: 360px; text-align: center; }
.mark { width: 56px; height: 56px; border-radius: 14px; margin: 0 auto 20px; display: block; }
.gate h1 { font-size: 26px; margin-bottom: 6px; }
.gate p { color: var(--muted); margin-bottom: 24px; }
.pin {
  width: 100%; font-size: 28px; letter-spacing: .4em; text-align: center; padding: 14px 12px 14px calc(12px + .4em);
  border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--ink); outline: none;
}
.pin:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.btn {
  width: 100%; margin-top: 12px; padding: 14px; border: 0; border-radius: var(--radius);
  background: var(--accent); color: var(--bg); font-weight: 650; font-size: 18px; cursor: pointer;
}
.btn:disabled { opacity: .6; cursor: default; }
.err { color: var(--blocked); min-height: 1.6em; margin-top: 12px; font-weight: 550; }

/* Header and nav */
header.top { padding: 28px 0 8px; }
header.top h1 { font-size: 28px; letter-spacing: -.01em; }
header.top .sub { color: var(--muted); margin-top: 4px; font-size: 15px; }
nav.chips {
  position: sticky; top: 0; z-index: 5; background: var(--bg);
  border-bottom: 1px solid var(--line); margin: 12px -16px 0; padding: 10px 16px;
  display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
}
nav.chips::-webkit-scrollbar { display: none; }
nav.chips a {
  flex: none; text-decoration: none; color: var(--ink); font-size: 15px; font-weight: 550;
  padding: 6px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface);
}
nav.chips a:hover { border-color: var(--accent); }

section { padding: 28px 0 4px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
.card + .card { margin-top: 12px; }

/* Hoy */
.hoy { display: grid; gap: 20px; }
.count { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.count .n { font-size: 56px; font-weight: 700; line-height: 1; letter-spacing: -.02em; color: var(--accent); }
.count .l { color: var(--muted); }
.divider { height: 1px; background: var(--line); }
.label { font-size: 13px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); margin-bottom: 4px; }
.big { font-size: 20px; font-weight: 650; }
.intro { color: var(--muted); }
.bar { height: 10px; border-radius: 999px; background: var(--accent-soft); overflow: hidden; margin: 10px 0 8px; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; min-width: 0; }
.fund-row { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.small { font-size: 15px; color: var(--muted); }

/* Tasks */
.group + .group { margin-top: 20px; }
.group-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; }
.group-head h3 { font-size: 19px; }
.group-head .small { flex: none; }
ul.tasks { list-style: none; margin: 0; padding: 0; }
ul.tasks li { display: grid; grid-template-columns: 26px 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
ul.tasks li:first-child { border-top: 0; padding-top: 2px; }
.box { width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--faint); margin-top: 2px; display: grid; place-items: center; }
.box svg { width: 14px; height: 14px; }
li.done .box { background: var(--done); border-color: var(--done); color: var(--surface); }
li.done .t { color: var(--faint); text-decoration: line-through; text-decoration-thickness: 1px; }
li.doing .box { border-color: var(--accent); background: linear-gradient(90deg, var(--accent) 50%, transparent 50%); }
li.blocked .box { border-color: var(--blocked); border-style: dashed; }
.tag { display: inline-block; font-size: 13px; font-weight: 600; padding: 1px 8px; border-radius: 999px; margin-top: 4px; }
.tag.blocked { background: var(--blocked-soft); color: var(--blocked); }
.tag.doing { background: var(--accent-soft); color: var(--accent); }

/* Plan timeline */
ol.phases { list-style: none; margin: 0; padding: 0; position: relative; }
ol.phases li { position: relative; padding: 0 0 16px 36px; }
ol.phases li::before { content: ""; position: absolute; left: 11px; top: 26px; bottom: 0; width: 2px; background: var(--line); }
ol.phases li:last-child::before { display: none; }
.dot {
  position: absolute; left: 0; top: 2px; width: 24px; height: 24px; border-radius: 50%;
  border: 2px solid var(--line); background: var(--bg); display: grid; place-items: center;
  font-size: 12px; font-weight: 700; color: var(--muted);
}
li.now .dot { border-color: var(--accent); background: var(--accent); color: var(--surface); }
li.past .dot { border-color: var(--done); background: var(--done); color: var(--surface); }
li.past .card { opacity: .72; }
li.now .card { border-color: var(--accent); border-width: 1.5px; }
.phase-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.phase-top h3 { font-size: 19px; }
.pill { font-size: 13px; font-weight: 650; color: var(--accent); background: var(--accent-soft); padding: 2px 10px; border-radius: 999px; }
.dates { font-size: 14px; color: var(--muted); }
.goal { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); font-weight: 600; }
.goal span { display: block; font-size: 13px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }

/* Log */
ol.log { list-style: none; margin: 0; padding: 0; }
ol.log li { display: grid; grid-template-columns: 76px 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
ol.log li:first-child { border-top: 0; padding-top: 0; }
ol.log time { font-size: 14px; color: var(--muted); font-weight: 600; padding-top: 2px; }

/* Services and rules */
.svc-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
.svc-top h3 { font-size: 18px; }
.price { font-weight: 700; color: var(--accent); }
.price.tbd { font-weight: 550; color: var(--faint); font-size: 15px; }
.svc p { color: var(--muted); }
ol.rules { margin: 0; padding: 0; list-style: none; counter-reset: r; }
ol.rules li { counter-increment: r; display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); }
ol.rules li:first-child { border-top: 0; padding-top: 0; }
ol.rules li::before { content: counter(r); font-weight: 700; color: var(--accent); }

footer { padding: 36px 0 48px; text-align: center; color: var(--faint); font-size: 14px; }
.link { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 8px; }

@media (min-width: 640px) {
  header.top { padding-top: 44px; }
  header.top h1 { font-size: 34px; }
  .card { padding: 24px; }
  .hoy { grid-template-columns: 1fr 1fr; }
  .hoy .full { grid-column: 1 / -1; }
  .hoy .divider { display: none; }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
</head>
<body>

<div class="gate" id="gate" hidden>
  <form class="gate-card" id="gateForm" autocomplete="off">
    <img class="mark" src="icon-192.png" alt="">
    <h1>Hola papá</h1>
    <p>Escribe el PIN que te mandó Paul.</p>
    <input class="pin" id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" aria-label="PIN" autocomplete="off">
    <button class="btn" id="enter" type="submit">Entrar</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</div>

<main id="app" hidden>
  <div class="wrap">
    <header class="top">
      <h1>Plan de regreso</h1>
      <div class="sub" id="updated"></div>
    </header>
    <nav class="chips" aria-label="Secciones">
      <a href="#hoy">Hoy</a>
      <a href="#tareas">Tareas</a>
      <a href="#plan">El plan</a>
      <a href="#vamos">Cómo vamos</a>
      <a href="#servicios">Servicios</a>
      <a href="#reglas">Reglas</a>
    </nav>

    <section id="hoy" aria-labelledby="h-hoy">
      <h2 id="h-hoy">Hoy</h2>
      <div class="card hoy" id="hoyCard"></div>
    </section>

    <section id="tareas" aria-labelledby="h-tareas">
      <h2 id="h-tareas">Tareas</h2>
      <div class="card" id="tasks"></div>
    </section>

    <section id="plan" aria-labelledby="h-plan">
      <h2 id="h-plan">El plan en cuatro etapas</h2>
      <ol class="phases" id="phases"></ol>
    </section>

    <section id="vamos" aria-labelledby="h-vamos">
      <h2 id="h-vamos">Cómo vamos</h2>
      <div class="card"><ol class="log" id="log"></ol></div>
    </section>

    <section id="servicios" aria-labelledby="h-serv">
      <h2 id="h-serv">Los tres servicios</h2>
      <div id="services"></div>
    </section>

    <section id="reglas" aria-labelledby="h-reglas">
      <h2 id="h-reglas">Reglas de la casa</h2>
      <div class="card"><ol class="rules" id="rules"></ol></div>
    </section>

    <footer>
      <div>Hecho por Paul para papá</div>
      <button class="link" id="logout" type="button">Salir en este equipo</button>
    </footer>
  </div>
</main>

<script>
(() => {
  const PIN_KEY = 'plan-regreso-pin';
  const enc = new TextEncoder();
  const $ = (id) => document.getElementById(id);

  // Storage can throw in private windows. Never let that break the page.
  const store = {
    get() { try { return localStorage.getItem(PIN_KEY); } catch { return null; } },
    set(v) { try { localStorage.setItem(PIN_KEY, v); } catch {} },
    clear() { try { localStorage.removeItem(PIN_KEY); } catch {} },
  };

  const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

  async function decrypt(pin, blob) {
    const base = await crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', hash: 'SHA-256', salt: unb64(blob.salt), iterations: blob.iter },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
    );
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(blob.iv) }, key, unb64(blob.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }

  async function loadBlob() {
    const res = await fetch('data.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error('data ' + res.status);
    return res.json();
  }

  // ---------- helpers ----------
  function el(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') n.className = v; else n.setAttribute(k, v);
    }
    for (const k of kids.flat()) if (k != null && k !== false) n.append(k.nodeType ? k : String(k));
    return n;
  }
  const day = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const today = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };
  const daysBetween = (a, b) => Math.round((b - a) / 86400000);
  const fmtDay = (s, opts) => day(s).toLocaleDateString('es-EC', opts || { day: 'numeric', month: 'long' });
  const money = (n) => '$' + String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  const check = () => {
    const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('viewBox', '0 0 16 16'); s.setAttribute('aria-hidden', 'true');
    s.innerHTML = '<path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>';
    return s;
  };

  function phaseState(p, t) {
    if (t >= day(p.to)) return 'past';
    if (t >= day(p.from)) return 'now';
    return 'next';
  }
  function currentPhase(phases, t) {
    return phases.find((p) => phaseState(p, t) === 'now')
      || (t < day(phases[0].from) ? phases[0] : phases[phases.length - 1]);
  }

  // ---------- render ----------
  function render(d) {
    const t = today();
    $('updated').textContent = 'Actualizado el ' + fmtDay(d.updated, { day: 'numeric', month: 'long', year: 'numeric' });

    // Hoy
    const left = Math.max(0, daysBetween(t, day(d.deadline)));
    const ph = currentPhase(d.phases, t);
    const f = d.fund;
    const pct = f.target ? Math.min(100, (f.saved / f.target) * 100) : 0;
    const bar = el('div', { class: 'bar', role: 'progressbar', 'aria-valuemin': 0, 'aria-valuemax': f.target, 'aria-valuenow': f.saved, 'aria-label': 'Fondo del pasaje' }, el('i'));
    bar.firstChild.style.width = pct + '%';
    $('hoyCard').replaceChildren(
      el('div', { class: 'full' },
        el('div', { class: 'count' }, el('span', { class: 'n' }, left), el('span', { class: 'l' }, 'días hasta el ' + fmtDay(d.deadline, { day: 'numeric', month: 'long', year: 'numeric' }))),
      ),
      el('div', { class: 'divider full' }),
      el('div', null,
        el('div', { class: 'label' }, `Etapa ${ph.n} de ${d.phases.length}`),
        el('div', { class: 'big' }, ph.title),
        el('p', { class: 'small', style: 'margin-top:4px' }, fmtDay(ph.from) + ' al ' + fmtDay(ph.to)),
      ),
      el('div', null,
        el('div', { class: 'label' }, 'Meta ahora'),
        el('div', { class: 'big' }, d.goalNow),
      ),
      el('div', { class: 'divider full' }),
      el('div', { class: 'full' },
        el('div', { class: 'label' }, 'Fondo del pasaje'),
        el('div', { class: 'fund-row' },
          el('span', { class: 'big' }, money(f.saved) + ' de ' + money(f.target)),
          f.targetWithLucho ? el('span', { class: 'small', style: 'align-self:end' }, 'Con Lucho: ' + money(f.targetWithLucho)) : null,
        ),
        bar,
        f.note ? el('p', { class: 'small' }, f.note) : null,
      ),
      el('div', { class: 'divider full' }),
      el('p', { class: 'intro full' }, d.intro),
    );

    // Tareas
    const order = { blocked: 0, doing: 1, todo: 2, done: 3 };
    const group = (title, list) => {
      const sorted = [...list].sort((a, b) => order[a.status] - order[b.status]);
      const done = list.filter((x) => x.status === 'done').length;
      return el('div', { class: 'group' },
        el('div', { class: 'group-head' }, el('h3', null, title), el('span', { class: 'small' }, `${done} de ${list.length} hechas`)),
        el('ul', { class: 'tasks' }, sorted.map((x) => el('li', { class: x.status },
          el('span', { class: 'box', 'aria-hidden': 'true' }, x.status === 'done' ? check() : null),
          el('div', null,
            el('div', { class: 't' }, x.text),
            x.status === 'blocked' ? el('span', { class: 'tag blocked' }, x.note || 'En espera') : null,
            x.status === 'doing' ? el('span', { class: 'tag doing' }, x.note || 'En curso') : null,
          ),
        ))),
      );
    };
    $('tasks').replaceChildren(group('Lo tuyo', d.tasks.eduardo), group('Lo que hace Paul', d.tasks.paul));

    // Plan
    $('phases').replaceChildren(...d.phases.map((p) => {
      const s = phaseState(p, t);
      const state = p === ph && s !== 'past' ? 'now' : s;
      return el('li', { class: state },
        el('span', { class: 'dot', 'aria-hidden': 'true' }, state === 'past' ? check() : p.n),
        el('div', { class: 'card' },
          el('div', { class: 'phase-top' },
            el('h3', null, p.title),
            state === 'now' ? el('span', { class: 'pill' }, 'Ahora') : el('span', { class: 'dates' }, fmtDay(p.from) + ' al ' + fmtDay(p.to)),
          ),
          state === 'now' ? el('p', { class: 'dates', style: 'margin-bottom:8px' }, fmtDay(p.from) + ' al ' + fmtDay(p.to)) : null,
          el('p', null, p.summary),
          el('div', { class: 'goal' }, el('span', null, 'Meta'), p.goal),
        ),
      );
    }));

    // Cómo vamos
    const log = [...d.log].sort((a, b) => b.date.localeCompare(a.date));
    $('log').replaceChildren(...log.map((x) => el('li', null,
      el('time', { datetime: x.date }, fmtDay(x.date, { day: 'numeric', month: 'short' })),
      el('p', null, x.text),
    )));

    // Servicios
    $('services').replaceChildren(...d.services.map((s) => el('div', { class: 'card svc' },
      el('div', { class: 'svc-top' },
        el('h3', null, s.name),
        s.price != null ? el('span', { class: 'price' }, typeof s.price === 'number' ? money(s.price) : s.price) : el('span', { class: 'price tbd' }, 'Precio por definir'),
      ),
      el('p', null, s.what),
    )));

    // Reglas
    $('rules').replaceChildren(...d.rules.map((r) => el('li', null, el('p', null, r))));
  }

  // ---------- flow ----------
  let blob = null;

  function showGate(msg) {
    $('app').hidden = true;
    $('gate').hidden = false;
    $('err').textContent = msg || '';
    $('pin').value = '';
    setTimeout(() => $('pin').focus(), 50);
  }

  async function tryOpen(pin) {
    const data = await decrypt(pin, blob); // throws on wrong PIN
    render(data);
    $('gate').hidden = true;
    $('app').hidden = false;
    return data;
  }

  $('gateForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pin = $('pin').value.trim();
    if (!pin) return;
    $('enter').disabled = true;
    $('enter').textContent = 'Abriendo';
    $('err').textContent = '';
    try {
      if (!blob) blob = await loadBlob();
      await tryOpen(pin);
      store.set(pin);
      window.scrollTo(0, 0);
    } catch (err) {
      $('err').textContent = blob ? 'PIN incorrecto. Prueba otra vez.' : 'No hay conexión. Prueba en un momento.';
      $('pin').select();
    } finally {
      $('enter').disabled = false;
      $('enter').textContent = 'Entrar';
    }
  });

  $('logout').addEventListener('click', () => { store.clear(); showGate(); });

  (async () => {
    try { blob = await loadBlob(); }
    catch { showGate('No hay conexión. Prueba en un momento.'); return; }
    const saved = store.get();
    if (saved) {
      try { await tryOpen(saved); return; }
      catch { store.clear(); }
    }
    showGate();
  })();

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
